    // ══════════════════════════════════════════════════
    // ✨  CREATE TRIP MODAL
    // ══════════════════════════════════════════════════
    function CreateTripModal({ user, profile, onCreated, onClose }) {
      const [name, setName]     = useState('');
      const [desc, setDesc]     = useState('');
      const [curr, setCurr]     = useState('AUD');
      const [expCurr, setExpCurr] = useState('AUD');
      const [members, setMems]  = useState([
        { key: 0, name: profile?.name || user.email.split('@')[0], email: user.email, userId: user.id, isYou: true },
      ]);
      const [newName, setNName] = useState('');
      const [newEmail, setNEml] = useState('');
      const [err, setErr]       = useState('');
      const [loading, setLoad]  = useState(false);
      const nextKey = useRef(1);

      const addLocal = () => {
        if (!newName.trim()) return;
        if (newEmail.trim() && !validEmail(newEmail)) { setErr("That email address doesn't look right. Check it, or leave it empty."); return; }
        setErr('');
        setMems(p => [...p, { key: nextKey.current++, name: newName.trim(), email: newEmail.trim() || null, userId: null, isYou: false }]);
        setNName(''); setNEml('');
      };

      const submit = async () => {
        if (!name.trim()) { setErr('Please enter a trip name.'); return; }
        if (newName.trim() && newEmail.trim() && !validEmail(newEmail)) { setErr("That email address doesn't look right. Check it, or leave it empty."); return; }
        // Auto-add person if they typed a name but forgot to press +
        const finalMembers = newName.trim()
          ? [...members, { key: nextKey.current++, name: newName.trim(), email: newEmail.trim() || null, userId: null, isYou: false }]
          : members;
        if (finalMembers.length < 2) { setErr('Add at least one other person.'); return; }
        setErr(''); setLoad(true);
        try {
          const trip = await createTrip(name.trim(), desc.trim(), curr, expCurr, user.id, finalMembers);
          onCreated(trip);
        } catch (e) { setLoad(false); setErr(e?.message || 'Failed to create trip.'); }
      };

      return (
        <Modal title="Create New Trip" onClose={onClose} wide>
          <div className="space-y-4">
            <TextInput label="Trip name *" placeholder="Italy 2025, Japan Trip, Vegas Weekend…" value={name} onChange={e => setName(e.target.value)} />
            <TextArea label="Description" placeholder="Optional note about the trip" value={desc} onChange={e => setDesc(e.target.value)} minRows={2} />
            <div className="grid grid-cols-2 gap-3">
              <SelectInput label="Default expense currency" value={expCurr} onChange={e => setExpCurr(e.target.value)}>
                {CURRENCIES.map(c => <option key={c}>{c}</option>)}
              </SelectInput>
              <SelectInput label="Default settlement currency" value={curr} onChange={e => setCurr(e.target.value)}>
                {CURRENCIES.map(c => <option key={c}>{c}</option>)}
              </SelectInput>
            </div>

            {/* Members */}
            <Field label={`People on this trip (${members.length})`}
              hint="Add email so they can log in and find this trip automatically.">
              <div className="space-y-2 mb-2">
                {members.map((m, i) => (
                  <div key={m.key} className="flex items-center gap-2 bg-parchment rounded-xl px-3 py-2.5">
                    <Avatar name={m.name} idx={i} size="sm" />
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-semibold text-ink truncate">{m.name}</p>
                      {m.email && <p className="text-xs text-muted truncate">{m.email}</p>}
                    </div>
                    {m.isYou
                      ? <span className="text-xs font-semibold text-gold">You</span>
                      : <button onClick={() => setMems(p => p.filter(x => x.key !== m.key))}
                          className="text-muted hover:text-rose transition text-xs">
                          <i className="fa-solid fa-xmark" />
                        </button>
                    }
                  </div>
                ))}
              </div>
              <div className="bg-parchment rounded-xl p-3">
                <p className="text-xs font-semibold text-muted uppercase tracking-widest mb-2">Add a person</p>
                <div className="flex flex-col gap-2">
                  <input value={newName} onChange={e => setNName(e.target.value)} placeholder="Name *"
                    onKeyDown={e => e.key === 'Enter' && addLocal()}
                    className="w-full px-3 py-2 bg-white border border-ink/12 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold/40" />
                  <div className="flex gap-2">
                    <input value={newEmail} onChange={e => setNEml(e.target.value)} placeholder="Email (optional)"
                      onKeyDown={e => e.key === 'Enter' && addLocal()}
                      className="flex-1 px-3 py-2 bg-white border border-ink/12 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold/40" />
                    <button onClick={addLocal}
                      className="bg-gold text-white px-4 py-2 rounded-lg text-sm hover:bg-gold-dark transition flex-shrink-0">
                      <i className="fa-solid fa-plus" />
                    </button>
                  </div>
                </div>
              </div>
            </Field>

            {err && <Toast message={err} />}

            <div className="flex gap-2 pt-1">
              <Btn variant="outline" full onClick={onClose}>Cancel</Btn>
              <Btn variant="gold" full loading={loading} onClick={submit}>Create Trip</Btn>
            </div>
          </div>
        </Modal>
      );
    }

    // ══════════════════════════════════════════════════
    // 📋  TRIP VIEW  (tabs wrapper)
    // ══════════════════════════════════════════════════
    function TripView({ trip: initialTrip, user, profile, onBack }) {
      const [trip, setTrip]         = useState(initialTrip);
      const [tab, setTab]           = useState('expenses');
      const [members, setMembers]   = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [payments, setPayments] = useState([]);
      const [loading, setLoading]   = useState(true);
      const [loadError, setLoadError] = useState('');
      const [showEditTrip, setEditTrip] = useState(false);
      const [confirmDelTrip, setConfirmDelTrip] = useState(false);
      const [deletingTrip, setDeletingTrip] = useState(false);
      const [showAccount, setShowAccount] = useState(false);
      const [showDesc, setShowDesc] = useState(false);
      const isCreator = trip.created_by === user.id;

      const load = useCallback(async () => {
        setLoading(true);
        setLoadError('');
        try {
          const [m, e, p] = await fetchTripAll(trip.id);
          // Check the current user is actually a member of this trip
          const isMember = m.some(member => member.user_id === user.id) || trip.created_by === user.id;
          if (!isMember) {
            setLoadError('not_a_member');
            return;
          }
          setMembers(m);
          setExpenses(e);
          setPayments(p);
        } catch (e) {
          console.error('Failed to load trip data:', e);
          setLoadError(e?.message || 'Could not load trip data.');
        } finally {
          setLoading(false);
        }
      }, [trip.id]);

      // Cheap refresh — only re-fetches payments and invalidates the settle
      // cache so balance pills recompute. Used after payment create/confirm/cancel
      // to avoid re-fetching members and expenses unnecessarily.
      const loadPayments = useCallback(async () => {
        try {
          const p = await fetchPayments(trip.id);
          setPayments(p);
          const prefix = trip.id + ':';
          const stale = _settleCacheKeys.filter(k => k.startsWith(prefix));
          stale.forEach(k => { delete _settleCache[k]; });
          stale.forEach(k => {
            const idx = _settleCacheKeys.indexOf(k);
            if (idx > -1) _settleCacheKeys.splice(idx, 1);
          });
        } catch(e) { logErr('loadPayments', e); }
      }, [trip.id]);

      useEffect(() => { load(); }, [load]);

      const TABS = [
        { key: 'expenses',    icon: 'fa-receipt',        label: 'Expenses' },
        { key: 'settlements', icon: 'fa-scale-balanced', label: 'Settle Up' },
        { key: 'people',      icon: 'fa-users',          label: 'People' },
      ];

      return (
        <div className="min-h-screen bg-cream flex flex-col">
          {/* Header */}
          <div className="bg-ink text-cream sticky top-0 z-20">
            <div className="max-w-lg mx-auto px-4">
              <div className="flex items-center gap-3 pt-4 pb-3">
                <button onClick={onBack}
                  className="flex items-center justify-center hover:opacity-80 transition active:scale-95 -ml-1"
                  title="Back to trips">
                  <div className="w-8 h-8 bg-gold rounded-lg flex items-center justify-center">
                    <i className="fa-solid fa-receipt text-white text-sm" />
                  </div>
                </button>
                <button onClick={load} className="flex-1 min-w-0 text-left hover:opacity-80 transition active:scale-95">
                  <h1 className="font-bold truncate tracking-tight">{trip.name}</h1>
                  <p className="text-xs text-cream/40 mt-0.5">
                    {loading ? '…' : `${members.length} people`} · {trip.base_currency}
                  </p>
                </button>
                {/* Gear icon — always visible, not just for creators */}
                <button onClick={() => setShowAccount(true)}
                  className="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-cream/10 transition text-cream/50 hover:text-cream" title="Account settings">
                  <i className="fa-solid fa-gear text-xs" />
                </button>
                {isCreator && (
                  <div className="flex items-center gap-1">
                    <button onClick={() => setEditTrip(true)}
                      className="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-cream/10 transition text-cream/50 hover:text-cream" title="Edit trip">
                      <i className="fa-solid fa-pen text-xs" />
                    </button>
                    {confirmDelTrip ? (
                      <div className="flex items-center gap-2 bg-rose/20 rounded-xl px-2 py-1">
                        <span className="text-xs text-cream/70">Delete trip?</span>
                        <button onClick={() => setConfirmDelTrip(false)} className="text-xs text-cream/50 hover:text-cream transition">No</button>
                        <button onClick={async () => {
                          setDeletingTrip(true);
                          try { await deleteTripById(trip.id); onBack(); }
                          catch(e) { setLoadError(e?.message || 'Delete failed.'); setDeletingTrip(false); setConfirmDelTrip(false); }
                        }} disabled={deletingTrip} className="text-xs font-semibold text-rose-300 hover:text-white transition">
                          {deletingTrip ? <Spinner /> : 'Yes'}
                        </button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirmDelTrip(true)}
                        className="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-cream/10 transition text-cream/50 hover:text-rose-300" title="Delete trip">
                        <i className="fa-solid fa-trash-can text-xs" />
                      </button>
                    )}
                  </div>
                )}
              </div>
              {/* Trip description — shown as a tappable strip if set */}
              {trip.description ? (
                <button onClick={() => setShowDesc(d => !d)}
                  className="w-full text-left py-2 flex items-start gap-1.5 group">
                  <p className={`text-xs text-cream/50 flex-1 ${showDesc ? 'break-words whitespace-pre-wrap' : 'truncate'}`}>
                    {trip.description}
                  </p>
                  <i className={`fa-solid fa-chevron-down text-cream/30 text-xs flex-shrink-0 mt-0.5 transition-transform group-hover:text-cream/50 ${showDesc ? 'rotate-180' : ''}`} />
                </button>
              ) : null}
              <div className="flex gap-1 -mb-px">
                {TABS.map(t => (
                  <button key={t.key} onClick={() => setTab(t.key)}
                    className={`flex items-center gap-1.5 px-3 py-2.5 text-xs font-semibold tracking-tight border-b-2 transition-all ${
                      tab === t.key ? 'text-gold border-gold' : 'text-cream/40 border-transparent hover:text-cream/70'
                    }`}>
                    <i className={`fa-solid ${t.icon} text-xs`} />
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {showEditTrip && (
            <EditTripModal trip={trip}
              onSaved={updated => { setTrip(updated); setEditTrip(false); }}
              onClose={() => setEditTrip(false)} />
          )}

          {showAccount && (
            <AccountModal user={user} onClose={() => setShowAccount(false)} />
          )}

          {/* Content */}
          <div className="flex-1 max-w-lg mx-auto w-full px-4 py-5">
            {loading ? (
              <div className="flex justify-center pt-16"><Spinner dark /></div>
            ) : loadError === 'not_a_member' ? (
              <div className="text-center py-16 bg-white rounded-2xl border border-ink/8 mt-4 fade-up">
                <div className="w-14 h-14 bg-parchment rounded-2xl flex items-center justify-center mx-auto mb-4">
                  <i className="fa-solid fa-lock text-gold text-xl" />
                </div>
                <p className="font-bold text-ink text-base">You're not on this trip</p>
                <p className="text-sm text-muted mt-2 mb-5 px-6 leading-relaxed">
                  Ask the trip creator to add your email address, then sign out and back in.
                </p>
                <Btn variant="ghost" onClick={onBack}>Back to my trips</Btn>
              </div>
            ) : loadError ? (
              <div className="text-center py-14 bg-white rounded-2xl border border-rose/20 mt-4 fade-up">
                <i className="fa-solid fa-triangle-exclamation text-2xl text-rose mb-3" />
                <p className="font-semibold text-ink">Connection error</p>
                <p className="text-sm text-muted mt-1 mb-4 px-4">{loadError}</p>
                <Btn variant="ghost" onClick={load}>Try again</Btn>
              </div>
            ) : (
              <>
                {tab === 'expenses'    && <ExpensesTab    trip={trip} members={members} expenses={expenses} payments={payments} user={user} onRefresh={load} onPaymentRefresh={loadPayments} />}
                {tab === 'settlements' && <SettlementsTab trip={trip} members={members} expenses={expenses} payments={payments} user={user} onRefresh={load} onPaymentRefresh={loadPayments} />}
                {tab === 'people'      && <PeopleTab      trip={trip} members={members} user={user} isCreator={isCreator} onRefresh={load} />}
              </>
            )}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // 💳  PAYMENT CARD
    // Shows a recorded payment in the expense list.
    // Green = confirmed, amber = pending confirmation.
    // ══════════════════════════════════════════════════
    function PaymentCard({ payment, members, user, onPaymentRefresh }) {
      const [acting, setActing] = useState(false);
      const [err, setErr]       = useState('');

      const fromM  = members.find(m => m.id === payment.from_member_id);
      const toM    = members.find(m => m.id === payment.to_member_id);
      const myM    = members.find(m => m.user_id === user.id);
      const iInitiated = payment.initiated_by === user.id;

      // If either party is an offline member (no account), any trip member
      // can confirm on their behalf — including the initiator, since mutual
      // confirmation isn't possible when one party has no account.
      const offlineMemberInvolved = fromM?.user_id == null || toM?.user_id == null;
      const iNeedToConfirm = myM && (
        offlineMemberInvolved
          ? (payment.from_member_id === myM.id || payment.to_member_id === myM.id || true)
          : (!iInitiated && (payment.from_member_id === myM.id || payment.to_member_id === myM.id))
      );

      // Who are we confirming on behalf of?
      const proxyFor = offlineMemberInvolved &&
        payment.from_member_id !== myM?.id &&
        payment.to_member_id   !== myM?.id
          ? (toM?.user_id == null ? toM : fromM)
          : null;

      const confirmed = payment.status === 'confirmed';

      const handleConfirm = async () => {
        setActing(true); setErr('');
        try { await confirmPayment(payment.id, user.id); await onPaymentRefresh(); }
        catch(e) { setErr(e?.message || 'Could not confirm payment.'); }
        setActing(false);
      };
      const handleCancel = async () => {
        setActing(true); setErr('');
        try { await cancelPayment(payment.id); await onPaymentRefresh(); }
        catch(e) { setErr(e?.message || 'Could not cancel payment.'); }
        setActing(false);
      };

      const bg  = confirmed ? 'bg-moss-light border-moss/20' : 'bg-gold/8 border-gold/20';
      const dot = confirmed ? 'bg-moss' : 'bg-gold';

      return (
        <div className={`rounded-2xl border p-4 ${bg}`}>
          <div className="flex items-center gap-3">
            <div className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${confirmed ? 'bg-moss/15' : 'bg-gold/15'}`}>
              <i className={`fa-solid fa-money-bill-transfer text-sm ${confirmed ? 'text-moss' : 'text-gold'}`} />
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-semibold text-ink truncate">
                {fromM?.name || 'Someone'} → {toM?.name || 'Someone'}
              </p>
              <div className="flex items-center gap-1.5 mt-0.5">
                <div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${dot}`} />
                <p className="text-xs text-muted">
                  {confirmed ? 'Payment confirmed' : 'Awaiting confirmation'}
                </p>
              </div>
            </div>
            <p className={`font-bold text-sm flex-shrink-0 ${confirmed ? 'text-moss' : 'text-gold'}`}>
              {fmt(payment.amount, payment.currency)}
            </p>
          </div>
          {/* Action row */}
          {!confirmed && (
            <div className="mt-3 pt-3 border-t border-black/5 space-y-2">
              <div className="flex items-center gap-2">
                {iNeedToConfirm ? (
                  <>
                    <p className="text-xs text-muted flex-1">
                      {proxyFor
                        ? `Confirm on behalf of ${proxyFor.name}`
                        : `${fromM?.name} says they paid — did you receive it?`}
                    </p>
                    <Btn sm variant="ghost" loading={acting} onClick={handleCancel}>Reject</Btn>
                    <Btn sm variant="gold" loading={acting} onClick={handleConfirm}>Confirm</Btn>
                  </>
                ) : iInitiated ? (
                  <>
                    <p className="text-xs text-muted flex-1">Waiting for {toM?.name} to confirm</p>
                    <Btn sm variant="ghost" loading={acting} onClick={handleCancel}>Cancel</Btn>
                  </>
                ) : (
                  <p className="text-xs text-muted">Waiting for confirmation between {fromM?.name} and {toM?.name}</p>
                )}
              </div>
              {err && <Toast message={err} />}
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // 💸  EXPENSES TAB
    // ══════════════════════════════════════════════════
    function ExpensesTab({ trip, members, expenses, payments, user, onRefresh, onPaymentRefresh }) {
      const [showAdd, setAdd]   = useState(false);
      const [editExp, setEdit]  = useState(null);
      const [deleting, setDel]  = useState(null);
      const [confirmDel, setConf] = useState(null);
      const [deleteErr, setDeleteErr] = useState('');

      const memberIdx  = (id) => members.findIndex(m => m.id === id);
      const memberName = (id) => members.find(m => m.id === id)?.name || 'Unknown';

      const handleDelete = async (id) => {
        setDel(id); setConf(null); setDeleteErr('');
        try { await removeExpense(id); await onRefresh(); }
        catch (e) { setDeleteErr(e?.message || 'Delete failed.'); setDel(null); }
      };

      // Pending payments are shown separately at the top so they're never missed.
      const grouped = useMemo(() => {
        const g = {};
        expenses.forEach(e => {
          if (!g[e.date]) g[e.date] = [];
          g[e.date].push({ type: 'expense', data: e, ts: new Date(e.created_at).getTime() });
        });
        (payments || []).filter(p => p.status === 'confirmed').forEach(p => {
          const date = localDateOf(p.created_at);
          if (!g[date]) g[date] = [];
          g[date].push({ type: 'payment', data: p, ts: new Date(p.created_at).getTime() });
        });
        // Sort within each day newest-first
        Object.values(g).forEach(items => items.sort((a, b) => b.ts - a.ts));
        return Object.entries(g).sort(([a], [b]) => b.localeCompare(a));
      }, [expenses, payments]);

      // Total spend and balance in trip base currency — computed together via
      // computeSettlements so FX rates are only fetched once. Always exactly
      // 3 pills regardless of how many currencies a trip uses.
      const [settleResult, setSettleResult] = useState(
        () => _settleCache[`${trip.id}:${trip.base_currency}`] || null
      );
      const [balanceLoading, setBalanceLoading] = useState(false);

      useEffect(() => {
        if (!expenses.length || !members.length) return;
        const key = `${trip.id}:${trip.base_currency}`;
        const hasCache = !!_settleCache[key];
        if (!hasCache) setBalanceLoading(true);
        const confirmedPayments = (payments || []).filter(p => p.status === 'confirmed');
        computeSettlements(expenses, members, trip.base_currency, confirmedPayments)
          .then(r => { cacheSet(_settleCache, _settleCacheKeys, key, r, 20); setSettleResult(r); })
          .catch(() => {})
          .finally(() => setBalanceLoading(false));
      }, [expenses, members, trip.id, trip.base_currency, payments]);

      // Synchronously derive per-expense converted amounts from _ratesCache once
      // rates are populated by the background settlement calculation.
      // Zero extra API calls — only uses what's already cached.
      const conversions = useMemo(() => {
        if (!settleResult) return {};
        const today = todayISO();
        const result = {};
        expenses.forEach(e => {
          if (e.currency === trip.base_currency) return;
          const fromL = e.currency.toLowerCase();
          const toL   = trip.base_currency.toLowerCase();
          const apiDate  = e.date >= today ? 'latest' : e.date;
          const cacheKey = `${fromL}@${apiDate}`;
          const rate = _ratesCache[cacheKey]?.[toL];
          if (rate) result[e.id] = Math.round(e.amount * rate * 100) / 100;
        });
        return result;
      }, [settleResult, expenses, trip.base_currency]);

      return (
        <div className="pb-24">
          {/* Summary pills — always exactly 3, fill full width */}
          {expenses.length > 0 && (
            <div className="flex gap-1.5 mb-4 overflow-hidden">
              <div className="flex-1 text-center bg-white rounded-full border border-ink/8 px-2 py-1.5 text-xs font-semibold text-ink whitespace-nowrap">
                {settleResult ? fmt(settleResult.totalSpend, trip.base_currency) + ' total' : '— total'}
              </div>
              <div className="flex-1 text-center bg-white rounded-full border border-ink/8 px-2 py-1.5 text-xs font-semibold text-muted whitespace-nowrap">
                {expenses.length} {expenses.length === 1 ? 'expense' : 'expenses'}
              </div>
              {(() => {
                const myMember = members.find(m => m.user_id === user.id);
                if (!myMember) return (
                  <div className="flex-1 text-center bg-parchment rounded-full border border-ink/8 px-2 py-1.5 text-xs font-semibold text-muted whitespace-nowrap">—</div>
                );
                if (balanceLoading) return (
                  <div className="flex-1 text-center bg-parchment rounded-full border border-ink/8 px-2 py-1.5 text-xs font-semibold text-muted flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <Spinner /> Calculating…
                  </div>
                );
                if (!settleResult) return (
                  <div className="flex-1 text-center bg-parchment rounded-full border border-ink/8 px-2 py-1.5 text-xs font-semibold text-muted whitespace-nowrap">—</div>
                );
                const bal = settleResult.balances[myMember.id] ?? 0;
                const isOwed = bal > 0.005;
                const isOwe  = bal < -0.005;
                const cls = isOwed ? 'bg-moss-light text-moss border-moss/20'
                          : isOwe  ? 'bg-rose-light text-rose border-rose/20'
                          : 'bg-parchment text-muted border-ink/8';
                const label = isOwed ? `Owed ${fmt(bal, trip.base_currency)}`
                            : isOwe  ? `Owe ${fmt(Math.abs(bal), trip.base_currency)}`
                            : 'Settled';
                return (
                  <div className={`flex-1 text-center rounded-full border px-2 py-1.5 text-xs font-semibold whitespace-nowrap ${cls}`}>
                    {label}
                  </div>
                );
              })()}
            </div>
          )}

          {/* Pending payments float to top so they're never missed */}
          {(payments || []).some(p => p.status === 'pending') && (
            <div className="space-y-2 mb-2">
              <p className="text-xs font-semibold text-muted uppercase tracking-widest px-1">Pending confirmation</p>
              {(payments || []).filter(p => p.status === 'pending').map(p => (
                <PaymentCard key={p.id} payment={p} members={members} user={user} onPaymentRefresh={onPaymentRefresh} />
              ))}
            </div>
          )}

          {grouped.length === 0 ? (
            <div className="text-center py-14 bg-white rounded-2xl border border-ink/8">
              <i className="fa-solid fa-receipt text-3xl text-gold/40 mb-3" />
              <p className="font-semibold text-ink">No expenses yet</p>
              <p className="text-sm text-muted mt-1">Tap below to add the first one</p>
            </div>
          ) : (
            <div className="space-y-5">
              {grouped.map(([date, dayItems]) => (
                <div key={date}>
                  <p className="text-xs font-semibold text-muted uppercase tracking-widest mb-2 px-1">
                    {fmtDateGroup(date)}
                  </p>
                  <div className="space-y-2">
                    {dayItems.map(item => item.type === 'payment'
                      ? <PaymentCard key={item.data.id} payment={item.data}
                          members={members} user={user} onPaymentRefresh={onPaymentRefresh} />
                      : <ExpenseCard key={item.data.id} expense={item.data}
                          memberName={memberName} memberIdx={memberIdx}
                          members={members} userId={user.id}
                          convertedAmount={conversions[item.data.id] ?? null}
                          baseCurrency={trip.base_currency}
                          onEdit={() => setEdit(item.data)}
                          onDelete={() => handleDelete(item.data.id)}
                          onConfirmDelete={() => setConf(item.data.id)}
                          onCancelDelete={() => setConf(null)}
                          onConfirm={confirmDel === item.data.id}
                          deleting={deleting === item.data.id} />
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {deleteErr && (
            <div className="fixed bottom-24 inset-x-4 z-30">
              <Toast message={deleteErr} />
            </div>
          )}

          {/* FAB */}
          <div className="fixed bottom-6 inset-x-0 flex justify-center z-20 pointer-events-none">
            <button onClick={() => setAdd(true)}
              className="pointer-events-auto flex items-center gap-2 bg-ink text-cream px-5 py-3.5 rounded-full shadow-xl hover:bg-ink/85 active:scale-95 transition-all font-semibold text-sm tracking-tight">
              <i className="fa-solid fa-plus text-gold" />
              Add Expense
            </button>
          </div>

          {showAdd && (
            <AddExpenseModal trip={trip} members={members} user={user}
              onAdded={() => { setAdd(false); onRefresh(); }}
              onClose={() => setAdd(false)} />
          )}
          {editExp && (
            <AddExpenseModal trip={trip} members={members} user={user}
              editExpense={editExp}
              onAdded={() => { setEdit(null); onRefresh(); }}
              onClose={() => setEdit(null)} />
          )}
        </div>
      );
    }

    function ExpenseCard({ expense, memberName, memberIdx, members, userId, convertedAmount, baseCurrency, onEdit, onDelete, onConfirmDelete, onCancelDelete, onConfirm, deleting }) {
      const isOwner = expense.created_by === userId;
      const [open, setOpen] = useState(false);
      const payer = memberName(expense.paid_by_member_id);
      const payerIdx = memberIdx(expense.paid_by_member_id);
      const addedBy = (members || []).find(m => m.user_id === expense.created_by)?.name || null;

      // Compute a short split summary for the collapsed card view
      const splitSummary = useMemo(() => {
        const splits = expense.expense_splits || [];
        if (!splits.length) return null;
        const totalMembers = (members || []).length;

        // Single person owes all
        if (splits.length === 1) {
          const name = memberName(splits[0].member_id);
          return name === payer ? 'Paid for themselves' : `${name} owes all`;
        }

        // Use stored split_type where available, fall back to amount detection
        const storedType = expense.split_type;
        const amounts = splits.map(s => s.amount);
        const min = Math.min(...amounts), max = Math.max(...amounts);
        const isEqual = storedType === 'equal' || storedType === 'percent'
          ? false  // percent is custom, equal uses storedType check below
          : (max - min) <= 0.02;

        const isStoredEqual   = storedType === 'equal';
        const isStoredPercent = storedType === 'percent';
        const isStoredExact   = storedType === 'exact';

        // Who's in the split
        const names = splits.map(s => memberName(s.member_id));
        const isAll = splits.length === totalMembers;
        const whoStr = isAll ? 'everyone' :
          names.length <= 3 ? names.join(', ') :
          `${names.slice(0, 2).join(', ')} +${names.length - 2}`;

        if (isStoredEqual)   return `Split equally · ${whoStr}`;
        if (isStoredPercent) return `Split by % · ${whoStr}`;
        if (isStoredExact)   return `Custom amounts · ${whoStr}`;
        if (isEqual)         return `Split equally · ${whoStr}`;
        return `Custom split · ${whoStr}`;
      }, [expense.expense_splits, members, payer]);

      return (
        <div className="bg-white rounded-2xl border border-ink/8 overflow-hidden transition-all">
          <button onClick={() => setOpen(!open)} className="w-full text-left p-4">
            <div className="flex items-center gap-3">
              <Avatar name={payer} idx={payerIdx} />
              <div className="flex-1 min-w-0">
                <p className={`font-bold text-ink ${open ? 'break-words' : 'truncate'}`}>{expense.description}</p>
                <p className="text-xs text-muted mt-0.5">{payer} paid · {fmtDate(expense.date)}</p>
                {splitSummary && <p className="text-xs text-muted/85 mt-0.5">{splitSummary}</p>}
                {addedBy && <p className="text-xs text-muted/65 mt-0.5">Added by {addedBy}</p>}
              </div>
              <div className="text-right flex-shrink-0">
                <p className="font-bold text-ink">{fmt(expense.amount, expense.currency)}</p>
                <p className="text-xs text-muted mt-0.5">{expense.currency}</p>
                {convertedAmount != null && (
                  <p className="text-xs text-muted/70 italic mt-0.5">({fmt(convertedAmount, baseCurrency)})</p>
                )}
              </div>
              <i className={`fa-solid fa-chevron-down text-muted text-xs transition-transform ${open ? 'rotate-180' : ''}`} />
            </div>
          </button>

          {open && (
            <div className="border-t border-parchment px-4 pb-4">
              <p className="text-xs font-semibold text-muted uppercase tracking-widest mt-3 mb-2.5">Split</p>
              <div className="space-y-2">
                {(expense.expense_splits || []).map(split => (
                  <div key={split.id} className="flex items-center gap-2.5">
                    <Avatar name={memberName(split.member_id)} idx={memberIdx(split.member_id)} size="sm" />
                    <span className="text-sm text-ink flex-1">{memberName(split.member_id)}</span>
                    <span className="text-sm font-semibold text-ink">{fmt(split.amount, expense.currency)}</span>
                  </div>
                ))}
              </div>
              <div className="mt-3 pt-3 border-t border-parchment flex items-center justify-between">
                {isOwner && (
                  <button onClick={onEdit}
                    className="flex items-center gap-1.5 text-xs text-muted hover:text-ink transition">
                    <i className="fa-solid fa-pen" /> Edit
                  </button>
                )}
                <div className="ml-auto">
                  {isOwner && (onConfirm ? (
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-muted">Sure?</span>
                      <button onClick={onCancelDelete} className="text-xs text-muted hover:text-ink transition">Cancel</button>
                      <button onClick={onDelete} disabled={deleting}
                        className="text-xs font-semibold text-rose hover:text-rose/70 transition disabled:opacity-50 flex items-center gap-1">
                        {deleting ? <Spinner /> : null} Yes, delete
                      </button>
                    </div>
                  ) : (
                    <button onClick={onConfirmDelete} disabled={deleting}
                      className="flex items-center gap-1.5 text-xs text-rose/60 hover:text-rose transition disabled:opacity-50">
                      <i className="fa-solid fa-trash-can" /> Delete
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // ➕  ADD EXPENSE MODAL
    // ══════════════════════════════════════════════════
    function AddExpenseModal({ trip, members, user, editExpense, onAdded, onClose }) {
      const isEdit = !!editExpense;

      const [desc, setDesc]       = useState(editExpense?.description || '');
      const [amount, setAmt]      = useState(editExpense ? fmtAmt(editExpense.amount) : '');
      const [currency, setCurr]   = useState(editExpense?.currency || trip.expense_currency || trip.base_currency);
      const [date, setDate]       = useState(editExpense?.date || todayISO());
      const [paidBy, setPaid]     = useState(editExpense?.paid_by_member_id || (() => { const me = members.find(m => m.user_id === user.id); return me?.id || members[0]?.id || ''; })());
      const [splitType, setSplitRaw] = useState(() => {
        if (!isEdit || !editExpense) return 'equal';
        // Use stored split_type if available
        if (editExpense.split_type) return editExpense.split_type;
        // Fallback: detect from amounts for expenses saved before this feature
        const splits = editExpense.expense_splits || [];
        if (!splits.length) return 'equal';
        if (splits.length === 1) return 'single';
        const amounts = splits.map(s => s.amount);
        const min = Math.min(...amounts), max = Math.max(...amounts);
        if (max - min <= 0.02) return 'equal';
        if (editExpense.amount > 0) {
          const allPct = splits.every(s => {
            const pct = s.amount / editExpense.amount * 100;
            return Math.abs(pct - Math.round(pct * 100) / 100) < 0.1;
          });
          if (allPct) return 'percent';
        }
        return 'exact';
      });
      const setSplit = (type) => {
        // When switching to exact, pre-fill from current equal split selection
        if (type === 'exact' && total > 0) {
          const hasValues = Object.values(exacts).some(v => parseFloat(String(v).replace(/,/g,'')) > 0);
          if (!hasValues) {
            const inc = members.filter(m => equalSet.has(m.id));
            const denom = inc.length || members.length;
            const share = Math.floor(total / denom * 100) / 100;
            const ids = (inc.length ? inc : members).map(m => m.id);
            const newEx = {};
            let running = 0;
            ids.forEach((id, i) => {
              if (i === ids.length - 1) {
                newEx[id] = String(Math.max(0, Math.round((total - running) * 100) / 100));
              } else {
                newEx[id] = String(share);
                running += share;
              }
            });
            // Zero out members not in selection
            members.forEach(m => { if (!newEx[m.id]) newEx[m.id] = '0'; });
            setExacts(newEx);
          }
        }
        // When switching to percent, pre-fill from equalSet if all zero
        if (type === 'percent' && total > 0) {
          const hasValues = Object.values(percents).some(v => parseFloat(v) > 0 && parseFloat(v) < 100);
          if (!hasValues) {
            const inc = members.filter(m => equalSet.has(m.id));
            const denom = inc.length || members.length;
            const share = Math.round(100 / denom * 100) / 100;
            const newP = {};
            members.forEach(m => { newP[m.id] = '0'; });
            inc.forEach((m, i) => {
              newP[m.id] = i === inc.length - 1
                ? String(Math.round((100 - share * (inc.length - 1)) * 100) / 100)
                : String(share);
            });
            setPercs(newP);
          }
        }
        setSplitRaw(type);
      };
      const [equalSet, setEqSet]  = useState(() => {
        if (isEdit && editExpense?.expense_splits?.length) {
          return new Set(editExpense.expense_splits.map(s => s.member_id));
        }
        return new Set(members.map(m => m.id));
      });
      const [percents, setPercs]  = useState(() => {
        if (isEdit && editExpense?.expense_splits?.length && editExpense.amount > 0) {
          const base = Object.fromEntries(members.map(m => [m.id, '0']));
          editExpense.expense_splits.forEach(s => {
            const pct = Math.round(s.amount / editExpense.amount * 10000) / 100;
            base[s.member_id] = String(pct);
          });
          return base;
        }
        return Object.fromEntries(members.map(m => [m.id, (100 / members.length).toFixed(2)]));
      });
      const [exacts, setExacts]   = useState(() => {
        if (isEdit) {
          const base = Object.fromEntries(members.map(m => [m.id, '']));
          (editExpense.expense_splits || []).forEach(s => { base[s.member_id] = String(s.amount); });
          return base;
        }
        return Object.fromEntries(members.map(m => [m.id, '']));
      });
      const [single, setSingle]   = useState(members[1]?.id || members[0]?.id || '');
      const [err, setErr]         = useState('');
      const [loading, setLoad]    = useState(false);
      const amtRef    = useRef(null);
      const cursorRef = useRef(null);

      useLayoutEffect(() => {
        if (cursorRef.current !== null && amtRef.current) {
          amtRef.current.setSelectionRange(cursorRef.current, cursorRef.current);
          cursorRef.current = null;
        }
      });

      const total    = parseAmt(amount);

      // Preserve cursor position through comma-formatting re-renders
      const handleAmtChange = (e) => {
        const el  = e.target;
        const raw = el.value;
        const pos = el.selectionStart;
        // Count digit-characters (non-comma) before cursor in raw string
        const digitsBefore = raw.slice(0, pos).replace(/,/g, '').length;
        const formatted = fmtAmt(raw);
        // Find where that digit-count falls in the formatted string
        let digits = 0, newPos = formatted.length;
        for (let i = 0; i < formatted.length; i++) {
          if (formatted[i] !== ',') {
            if (digits === digitsBefore) { newPos = i; break; }
            digits++;
          }
        }
        // Handle cursor-at-start (digitsBefore === 0)
        if (digitsBefore === 0) newPos = 0;
        cursorRef.current = newPos;
        setAmt(formatted);
      };
      const pctTotal = useMemo(
        () => Object.values(percents).reduce((s, v) => s + (parseFloat(v) || 0), 0),
        [percents]
      );
      const exTotal = useMemo(
        () => Object.values(exacts).reduce((s, v) => s + (parseFloat(String(v).replace(/,/g, '')) || 0), 0),
        [exacts]
      );

      // Compute actual equal-split amounts using integer cent arithmetic to
      // avoid floating point errors (e.g. 16.9 / 2 = 8.449999... not 8.45).
      // Any genuine remainder (e.g. $10 / 3 = 3.33, 3.33, 3.34) goes to the last person.
      const equalAmounts = useMemo(() => {
        if (total <= 0 || !equalSet.size) return { amounts: {}, hasRemainder: false };
        const inc = members.filter(m => equalSet.has(m.id));
        const totalCents = Math.round(total * 100);
        const shareCents = Math.floor(totalCents / inc.length);
        const hasRemainder = totalCents % inc.length !== 0;
        const amounts = {};
        inc.forEach(m => { amounts[m.id] = shareCents / 100; });
        return { amounts, hasRemainder };
      }, [total, equalSet, members]);

      // Percentage mode: when a field changes, redistribute the remaining %
      // across members BELOW the changed field only. Members above are never touched,
      // so editing from top to bottom gives predictable control.
      const handlePercentChange = (memberId, newVal) => {
        const idx = members.findIndex(m => m.id === memberId);
        const newPercs = { ...percents, [memberId]: newVal };

        // Sum of everyone above (fixed — don't touch them)
        const sumAbove = members.slice(0, idx).reduce(
          (s, m) => s + (parseFloat(percents[m.id]) || 0), 0
        );
        const remaining = Math.max(0, 100 - sumAbove - (parseFloat(newVal) || 0));
        const below = members.slice(idx + 1);

        if (below.length > 0) {
          const perBelow = remaining / below.length;
          below.forEach((m, i) => {
            const isLast = i === below.length - 1;
            const soFar  = below.slice(0, i).reduce(
              (s, om) => s + (parseFloat(newPercs[om.id]) || 0), 0
            );
            newPercs[m.id] = String(
              Math.round((isLast ? remaining - soFar : perBelow) * 100) / 100
            );
          });
        }
        setPercs(newPercs);
      };

      // Exact mode: change one amount, redistribute remainder downward
      const handleExactChange = (memberId, newVal) => {
        const idx    = members.findIndex(m => m.id === memberId);
        const newEx  = { ...exacts, [memberId]: newVal };
        const sumAbove = members.slice(0, idx).reduce(
          (s, m) => s + (parseFloat(String(exacts[m.id]).replace(/,/g,'')) || 0), 0
        );
        const remaining = Math.max(0, total - sumAbove - (parseFloat(String(newVal).replace(/,/g,'')) || 0));
        const below = members.slice(idx + 1);
        if (below.length > 0) {
          const perBelow = remaining / below.length;
          below.forEach((m, i) => {
            const isLast = i === below.length - 1;
            const soFar  = below.slice(0, i).reduce(
              (s, om) => s + (parseFloat(String(newEx[om.id]).replace(/,/g,'')) || 0), 0
            );
            newEx[m.id] = String(Math.round((isLast ? remaining - soFar : perBelow) * 100) / 100);
          });
        }
        setExacts(newEx);
      };

      const buildSplits = () => {
        if (splitType === 'equal') {
          const inc = members.filter(m => equalSet.has(m.id));
          if (!inc.length) return null;
          const totalCents = Math.round(total * 100);
          const shareCents = Math.floor(totalCents / inc.length);
          const remainder = totalCents - shareCents * inc.length;
          // Start everyone at floor amount
          const cents = {};
          inc.forEach(m => { cents[m.id] = shareCents; });
          // Distribute each extra cent to a different random person (no duplicates)
          [...inc].sort(() => Math.random() - 0.5)
            .slice(0, remainder)
            .forEach(m => { cents[m.id] += 1; });
          return inc.map(m => ({ memberId: m.id, amount: cents[m.id] / 100 }));
        }
        if (splitType === 'percent') {
          if (Math.abs(pctTotal - 100) > 0.1) return null;
          const pctRows = members.filter(m => (parseFloat(percents[m.id]) || 0) > 0);
          let running = 0;
          return pctRows.map((m, i) => {
            const isLast = i === pctRows.length - 1;
            const amt = isLast
              ? Math.round((total - running) * 100) / 100
              : Math.round(total * (parseFloat(percents[m.id]) || 0) / 100 * 100) / 100;
            running += amt;
            return { memberId: m.id, amount: amt };
          });
        }
        if (splitType === 'exact') {
          const rows = members
            .map(m => ({ memberId: m.id, amount: Math.round((parseFloat(String(exacts[m.id]).replace(/,/g,'')) || 0) * 100) / 100 }))
            .filter(s => s.amount > 0);
          if (!rows.length) return null;
          return rows;
        }
        if (splitType === 'single') {
          return [{ memberId: single, amount: total }];
        }
      };

      const submit = async () => {
        setErr('');
        if (!desc.trim()) { setErr('Please add a description.'); return; }
        const effectiveTotal = splitType === 'exact' ? exTotal : total;
        if (!effectiveTotal || effectiveTotal <= 0) { setErr('Enter a valid amount.'); return; }
        // Exact mode: validate mismatch BEFORE calling buildSplits
        if (splitType === 'exact' && total > 0 && Math.abs(exTotal - total) > 0.02) {
          setErr(`Split amounts (${fmt(exTotal, currency)}) must equal the total (${fmt(total, currency)})`);
          return;
        }
        const splits = buildSplits();
        if (!splits) {
          if (splitType === 'equal')   { setErr('Select at least one person.'); return; }
          if (splitType === 'percent') { setErr(`Percentages must sum to 100% — currently ${pctTotal.toFixed(2)}%`); return; }
          if (splitType === 'exact')   { setErr('Enter amounts for at least one person.'); return; }
        }
        setLoad(true);
        try {
          // In exact mode, the amount field may be 0 if user only filled splits.
          // Use the sum of splits as the authoritative amount in that case.
          const finalAmount = (splitType === 'exact' && exTotal > 0 && total === 0) ? exTotal : total;
          if (isEdit) {
            await updateExpenseRecord(editExpense.id, {
              paid_by_member_id: paidBy,
              amount: finalAmount, currency, date,
              description: desc.trim(),
              split_type: splitType,
            }, splits);
          } else {
            await saveExpense(trip.id, {
              paid_by_member_id: paidBy,
              amount: finalAmount, currency, date,
              description: desc.trim(),
              split_type: splitType,
            }, splits, user.id);
          }
          onAdded();
        } catch (e) { setLoad(false); setErr(e?.message || 'Failed to save expense.'); }
      };

      const SPLIT_TABS = [
        { key: 'equal',   label: 'Equal' },
        { key: 'percent', label: '%' },
        { key: 'exact',   label: 'Exact' },
        { key: 'single',  label: '1 Person' },
      ];

      return (
        <Modal title={isEdit ? "Edit Expense" : "Add Expense"} onClose={onClose} wide>
          <div className="space-y-4">
            <TextArea label="Description *" placeholder="Dinner, train tickets, hotel deposit…" value={desc} onChange={e => setDesc(e.target.value)} minRows={1} />

            <div className="flex gap-2">
              <div className="flex-1">
                <Field label="Amount *">
                  <input
                    ref={amtRef}
                    type="text" inputMode="decimal" placeholder="0.00"
                    value={amount}
                    onChange={handleAmtChange}
                    className={inputCls}
                  />
                </Field>
              </div>
              <div className="w-28">
                <SelectInput label="Currency" value={currency} onChange={e => setCurr(e.target.value)}>
                  {CURRENCIES.map(c => <option key={c}>{c}</option>)}
                </SelectInput>
              </div>
            </div>

            <div className="flex gap-2">
              <div className="flex-1">
                <TextInput label="Date" type="date" value={date} onChange={e => setDate(e.target.value)} />
                {date > todayISO() && (
                  <p className="text-xs text-gold mt-1.5 flex items-start gap-1.5">
                    <i className="fa-solid fa-circle-info flex-shrink-0 mt-0.5" />
                    <span>Future date — today's exchange rate will be used until {fmtDate(date)}, after which the actual rate for that day applies automatically.</span>
                  </p>
                )}
              </div>
              <div className="flex-1">
                <SelectInput label="Paid by" value={paidBy} onChange={e => setPaid(e.target.value)}>
                  {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                </SelectInput>
              </div>
            </div>

            {/* Split type selector */}
            <div>
              <Field label="How to split">
                <div className="flex gap-1 bg-parchment rounded-xl p-1">
                  {SPLIT_TABS.map(st => (
                    <button key={st.key} onClick={() => setSplit(st.key)}
                      className={`flex-1 py-1.5 rounded-lg text-xs font-semibold tracking-tight transition-all ${splitType === st.key ? 'bg-white shadow text-ink' : 'text-muted'}`}>
                      {st.label}
                    </button>
                  ))}
                </div>
              </Field>

              <div className="mt-3 bg-parchment rounded-2xl p-3">

                {/* Equal */}
                {splitType === 'equal' && (
                  <div className="space-y-1">
                    {members.map((m, i) => (
                      <label key={m.id} className="flex items-center gap-3 p-2 rounded-xl hover:bg-white/50 cursor-pointer transition">
                        <input type="checkbox" checked={equalSet.has(m.id)}
                          onChange={e => {
                            const s = new Set(equalSet);
                            e.target.checked ? s.add(m.id) : s.delete(m.id);
                            setEqSet(s);
                          }} className="w-4 h-4" />
                        <Avatar name={m.name} idx={i} size="sm" />
                        <span className="text-sm text-ink flex-1 font-medium">{m.name}</span>
                        {total > 0 && equalSet.has(m.id) && equalAmounts.amounts[m.id] !== undefined && (
                          <span className="text-xs text-muted font-semibold flex-shrink-0">
                            {equalAmounts.hasRemainder ? '~' : ''}{fmt(equalAmounts.amounts[m.id], currency)}
                          </span>
                        )}
                      </label>
                    ))}
                  </div>
                )}

                {/* Percentage */}
                {splitType === 'percent' && (
                  <div className="space-y-2">
                    <div className={`text-right text-xs font-bold ${Math.abs(pctTotal - 100) > 0.1 ? 'text-rose' : 'text-moss'}`}>
                      {pctTotal.toFixed(2)}% / 100%
                    </div>
                    {members.map((m, i) => (
                      <div key={m.id} className="flex items-center gap-2 py-0.5">
                        <Avatar name={m.name} idx={i} size="sm" />
                        <div className="flex-1 min-w-0">
                          <span className="text-sm text-ink font-medium block truncate">{m.name}</span>
                          {total > 0 && (
                            <span className="text-xs text-muted font-semibold">
                              {fmt(total * (parseFloat(percents[m.id]) || 0) / 100, currency)}
                            </span>
                          )}
                        </div>
                        <input type="number" value={percents[m.id]} min="0" max="100" step="0.01"
                          onChange={e => handlePercentChange(m.id, e.target.value)}
                          className="w-20 flex-shrink-0 px-2 py-1.5 bg-white border border-ink/12 rounded-lg text-sm text-right font-semibold focus:outline-none focus:ring-2 focus:ring-gold/40" />
                        <span className="text-xs text-muted flex-shrink-0">%</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Exact */}
                {splitType === 'exact' && (
                  <div className="space-y-2">
                    {total > 0 && (
                      <div className={`text-right text-xs font-bold ${Math.abs(exTotal - total) > 0.02 ? 'text-rose' : 'text-moss'}`}>
                        {fmt(exTotal, currency)} / {fmt(total, currency)}
                        {Math.abs(exTotal - total) > 0.02 && ` · ${fmt(total - exTotal, currency)} unassigned`}
                      </div>
                    )}
                    {members.map((m, i) => (
                      <div key={m.id} className="flex items-center gap-2">
                        <Avatar name={m.name} idx={i} size="sm" />
                        <span className="text-sm text-ink flex-1 font-medium">{m.name}</span>
                        <input type="number" value={exacts[m.id]} min="0" step="0.01" placeholder="0.00"
                          onChange={e => handleExactChange(m.id, e.target.value)}
                          className="w-32 px-2 py-1.5 bg-white border border-ink/12 rounded-lg text-sm text-right font-semibold focus:outline-none focus:ring-2 focus:ring-gold/40" />
                      </div>
                    ))}
                  </div>
                )}

                {/* Single person */}
                {splitType === 'single' && (
                  <div className="space-y-1">
                    <p className="text-xs text-muted mb-2">Who owes the entire amount?</p>
                    {members.map((m, i) => (
                      <label key={m.id}
                        className={`flex items-center gap-3 p-2 rounded-xl cursor-pointer transition border ${single === m.id ? 'bg-white border-gold/40' : 'border-transparent hover:bg-white/50'}`}>
                        <input type="radio" name="single" value={m.id} checked={single === m.id}
                          onChange={() => setSingle(m.id)} className="w-4 h-4" />
                        <Avatar name={m.name} idx={i} size="sm" />
                        <span className="text-sm text-ink flex-1 font-medium">{m.name}</span>
                        {single === m.id && total > 0 && (
                          <span className="text-xs font-bold text-gold">{fmt(total, currency)}</span>
                        )}
                      </label>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {err && <Toast message={err} />}

            <div className="flex gap-2 pt-1">
              <Btn variant="outline" full onClick={onClose}>Cancel</Btn>
              <Btn variant="gold" full loading={loading} onClick={submit}>Save Expense</Btn>
            </div>
          </div>
        </Modal>
      );
    }

    function SettlementsTab({ trip, members, expenses, payments, user, onRefresh, onPaymentRefresh }) {
      const [currency, setCurr]    = useState(trip.base_currency);
      const cacheKey               = `${trip.id}:${currency}`;
      const confirmedPayments      = useMemo(() => (payments || []).filter(p => p.status === 'confirmed'), [payments]);
      const [result, setResult]    = useState(_settleCache[cacheKey] || null);
      const [calculating, setCalc] = useState(false);
      const [rateError, setRateError] = useState('');

      // Mark-as-paid state
      const [payingTxn, setPayingTxn] = useState(null); // { from, to, amount }
      const [payAmt, setPayAmt]       = useState('');
      const [paying, setPaying]       = useState(false);
      const [payErr, setPayErr]       = useState('');

      const myMember    = members.find(m => m.user_id === user.id);
      const memberName  = (id) => members.find(m => m.id === id)?.name || 'Unknown';
      const memberIdx   = (id) => members.findIndex(m => m.id === id);

      const compute = useCallback(async () => {
        if (!members.length) return;
        const key = `${trip.id}:${currency}`;
        const hasCache = !!_settleCache[key];
        if (!hasCache) setCalc(true);
        setRateError('');
        try {
          const r = await computeSettlements(expenses, members, currency, confirmedPayments);
          cacheSet(_settleCache, _settleCacheKeys, key, r, 20);
          setResult(r);
        } catch(e) {
          setRateError(e.message || 'Could not fetch exchange rates.');
        } finally {
          setCalc(false);
        }
      }, [expenses, members, currency, trip.id, confirmedPayments]);

      useEffect(() => {
        const key = `${trip.id}:${currency}`;
        if (_settleCache[key]) setResult(_settleCache[key]);
      }, [currency, trip.id]);

      useEffect(() => { compute(); }, [compute]);

      const startPay = (txn) => {
        setPayingTxn(txn);
        setPayAmt(fmtAmt(txn.amount));
        setPayErr('');
      };

      const submitPayment = async () => {
        const amt = parseAmt(payAmt);
        if (!amt || amt <= 0) { setPayErr('Enter a valid amount.'); return; }
        if (!myMember) return;
        setPaying(true); setPayErr('');
        try {
          await createPayment({
            tripId: trip.id,
            fromMemberId: payingTxn.from,
            toMemberId: payingTxn.to,
            amount: amt,
            currency,
            userId: user.id,
          });
          setPayingTxn(null);
          await onPaymentRefresh();
        } catch(e) { setPayErr(e?.message || 'Could not record payment.'); }
        setPaying(false);
      };

      // Pending payments relevant to current user
      const myPending = useMemo(() => (payments || []).filter(p =>
        p.status === 'pending' && myMember &&
        (p.from_member_id === myMember.id || p.to_member_id === myMember.id)
      ), [payments, myMember]);

      return (
        <div className="space-y-4 pb-8">

          {/* Pending confirmations banner */}
          {myPending.length > 0 && (
            <div className="space-y-2">
              <p className="text-xs font-semibold text-muted uppercase tracking-widest px-1">Pending confirmation</p>
              {myPending.map(p => (
                <PaymentCard key={p.id} payment={p} members={members} user={user} onPaymentRefresh={onPaymentRefresh} />
              ))}
            </div>
          )}

          {/* Currency chooser */}
          <div className="bg-white rounded-2xl border border-ink/8 p-4">
            <div className="flex items-center gap-3">
              <div>
                <p className="text-xs font-semibold text-muted uppercase tracking-widest">Display currency</p>
                <p className="text-xs text-muted mt-0.5">All amounts converted at historical rates</p>
              </div>
              <select value={currency} onChange={e => setCurr(e.target.value)}
                className="ml-auto px-3 py-1.5 bg-parchment border border-ink/12 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-gold/40">
                {CURRENCIES.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
          </div>

          {calculating ? (
            <div className="text-center py-12">
              <div className="mb-3"><Spinner dark /></div>
              <p className="text-xs text-muted">Fetching exchange rates…</p>
            </div>
          ) : rateError ? (
            <div className="bg-rose-light border border-rose/20 rounded-2xl p-4">
              <div className="flex gap-3 items-start">
                <i className="fa-solid fa-triangle-exclamation text-rose mt-0.5 flex-shrink-0" />
                <div>
                  <p className="text-sm font-semibold text-ink">Exchange rate error</p>
                  <p className="text-xs text-muted mt-1">{rateError}</p>
                  <button onClick={compute} className="text-xs font-semibold text-rose hover:text-rose/70 mt-2 transition">Try again</button>
                </div>
              </div>
            </div>
          ) : result ? (
            <>
              {/* Per-person balances */}
              <div className="bg-white rounded-2xl border border-ink/8 overflow-hidden">
                <div className="px-4 pt-4 pb-2">
                  <p className="text-xs font-semibold text-muted uppercase tracking-widest">Balance per person</p>
                </div>
                {members.map((m, i) => {
                  const bal = result.balances[m.id] ?? 0;
                  const isPos = bal > 0.005, isNeg = bal < -0.005;
                  return (
                    <div key={m.id} className="flex items-center gap-3 px-4 py-3 border-t border-parchment first:border-0">
                      <Avatar name={m.name} idx={i} size="sm" />
                      <span className="text-sm font-medium text-ink flex-1">{m.name}</span>
                      <div className="text-right">
                        <span className={`text-sm font-bold ${isPos ? 'text-moss' : isNeg ? 'text-rose' : 'text-muted'}`}>
                          {isPos ? '+' : ''}{fmt(bal, currency)}
                        </span>
                        <p className="text-xs text-muted mt-0.5">{isPos ? 'gets back' : isNeg ? 'owes' : 'settled'}</p>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Transactions */}
              <div>
                <p className="text-xs font-semibold text-muted uppercase tracking-widest mb-2 px-1">Who pays whom</p>
                {result.settlements.length === 0 ? (
                  <div className="bg-white rounded-2xl border border-ink/8 p-6 text-center">
                    <i className="fa-solid fa-circle-check text-3xl text-moss mb-2" />
                    <p className="font-semibold text-ink">All settled up!</p>
                    <p className="text-sm text-muted mt-1">No payments needed</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {result.settlements.map((txn, i) => {
                      const isFromMe = myMember?.id === txn.from;
                      const isToMe   = myMember?.id === txn.to;
                      const isInvolved = isFromMe || isToMe;
                      const isPaying = payingTxn?.from === txn.from && payingTxn?.to === txn.to;
                      const existingPending = (payments || []).find(p =>
                        p.status === 'pending' &&
                        p.from_member_id === txn.from &&
                        p.to_member_id === txn.to
                      );

                      return (
                        <div key={i} className="bg-white rounded-2xl border border-ink/8 p-4">
                          {/* Main row */}
                          <div className="flex items-center gap-3">
                            <Avatar name={memberName(txn.from)} idx={memberIdx(txn.from)} />
                            <div className="flex-1 min-w-0">
                              <p className="text-sm text-ink">
                                <span className="font-bold">{isFromMe ? 'You' : memberName(txn.from)}</span>
                                <span className="text-muted"> → </span>
                                <span className="font-bold">{isToMe ? 'you' : memberName(txn.to)}</span>
                              </p>
                            </div>
                            <p className="font-bold text-gold text-base flex-shrink-0">{fmt(txn.amount, currency)}</p>
                            <Avatar name={memberName(txn.to)} idx={memberIdx(txn.to)} />
                          </div>

                          {/* Action area */}
                          {isInvolved && !existingPending && !isPaying && (
                            <div className="mt-3 pt-3 border-t border-parchment">
                              <button onClick={() => startPay(txn)}
                                className="w-full flex items-center justify-center gap-2 py-1.5 text-xs font-semibold text-gold hover:text-gold-dark transition">
                                <i className="fa-solid fa-check" />
                                {isFromMe ? "I've paid this" : "Mark as received"}
                              </button>
                            </div>
                          )}

                          {/* Inline pay form */}
                          {isPaying && (
                            <div className="mt-3 pt-3 border-t border-parchment space-y-2">
                              <p className="text-xs text-muted">Confirm amount paid in {currency}:</p>
                              <input
                                type="text" inputMode="decimal"
                                value={payAmt}
                                onChange={e => {
                                  const raw = e.target.value.replace(/,/g, '');
                                  if (raw === '' || /^[\d.]*$/.test(raw)) setPayAmt(fmtAmt(raw));
                                }}
                                className="w-full px-3 py-2 bg-parchment border border-ink/12 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-gold/40"
                              />
                              <div className="flex gap-2">
                                <Btn sm variant="ghost" onClick={() => { setPayingTxn(null); setPayErr(''); }}>Cancel</Btn>
                                <Btn sm variant="gold" full loading={paying} onClick={submitPayment}>Confirm payment</Btn>
                              </div>
                              {payErr && <Toast message={payErr} />}
                            </div>
                          )}

                          {/* Existing pending payment */}
                          {existingPending && !isPaying && (
                            <div className="mt-3 pt-3 border-t border-parchment">
                              <p className="text-xs text-gold font-semibold flex items-center gap-1.5">
                                <i className="fa-solid fa-clock" />
                                Payment of {fmt(existingPending.amount, existingPending.currency)} pending confirmation
                              </p>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {expenses.length > 0 && (
                <p className="text-xs text-center text-muted/70 pb-1">
                  <i className="fa-solid fa-circle-info mr-1" />
                  Rates via <a href="https://github.com/fawazahmed0/exchange-api" target="_blank" rel="noreferrer" className="underline">exchange-api</a> · Historical rate used per expense date
                </p>
              )}
            </>
          ) : null}
        </div>
      );
    }
