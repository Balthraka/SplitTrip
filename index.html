  <style>
    * { font-family: 'Sora', sans-serif; }
    body { background-color: #F5F0E8; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(100%); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fade-up  { animation: fadeUp  0.28s cubic-bezier(0.16,1,0.3,1) both; }
    .slide-up { animation: slideUp 0.32s cubic-bezier(0.16,1,0.3,1) both; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .spinner-dark {
      border-color: rgba(30,27,22,0.2);
      border-top-color: #1E1B16;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #C8B89A; border-radius: 2px; }

    /* Input styling override */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    /* Checkbox */
    input[type="checkbox"] { accent-color: #C8964C; }
    input[type="radio"]    { accent-color: #C8964C; }

    /* Modal */
    .modal-bg { backdrop-filter: blur(6px); background: rgba(30,27,22,0.45); }

<body class="min-h-screen">
  <div id="root"></div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.7/babel.min.js" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" crossorigin="anonymous"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script type="text/babel" data-presets="react">

    // ══════════════════════════════════════════════════
    // ⚙️  CONFIG  (public values only: no secret lives in this page)
    // ══════════════════════════════════════════════════
    const API_BASE         = 'https://splittrip-api.balthraka.workers.dev';
    const GOOGLE_CLIENT_ID = '667390589368-3segjqnp0agt3necuv41pr5vrrlb122a.apps.googleusercontent.com';
    const MS_CLIENT_ID     = '';   // empty = the Microsoft button stays hidden
    // Storage key unique to this app: every app on github.io shares one browser origin.
    const TOKEN_KEY        = 'splittrip.session.v1';

    // ── Error log — captures what the server actually returns on failure ──
    // View in browser console: copy(JSON.stringify(window._errLog, null, 2))
    window._errLog = window._errLog || [];
    const logErr = (context, error) => {
      const entry = {
        time: new Date().toISOString(),
        context,
        message:  error?.message || String(error),
        code:     error?.code,
        status:   error?.status,
        details:  error?.details,
        hint:     error?.hint,
        stack:    error?.stack?.split('\n').slice(0, 3).join(' | '),
      };
      window._errLog.push(entry);
      if (window._errLog.length > 50) window._errLog.shift(); // cap at 50 entries
      console.warn('[SplitTrip error]', entry);
    };

    // ══════════════════════════════════════════════════
    // 🔌  API CLIENT
    // One small wrapper around fetch. The session token is stored in this app's own key and sent as a bearer header.
    // ══════════════════════════════════════════════════
    class ApiError extends Error {
      constructor(status, code, message) { super(message); this.status = status; this.code = code; }
    }
    const FRIENDLY = {
      not_invited:           "That Google account hasn't been invited to SplitTrip yet.",
      email_not_verified:    'Google says that email address is not verified.',
      account_already_linked:'That account is already linked to a different sign-in.',
      stale_version:         'Someone else changed this while you were editing. Close it and reopen to see the latest.',
      member_paid_expenses:  "This person paid for an expense, so they can't be removed.",
      forbidden:             "You don't have permission to do that.",
      not_found:             'That no longer exists.',
      invalid_email:         "That email address doesn't look right. Check it and try again.",
      invalid_member_email:  "That email address doesn't look right. Check it and try again.",
      too_many_members:      'A trip can have up to 40 people.',
      invalid_members:       'A trip can have up to 40 people, and each needs a name.',
      invalid_splits:        "Those split amounts aren't valid. An expense can be shared by up to 40 people, all of them in this trip.",
      splits_do_not_sum:     "The split amounts don't add up to the total.",
      member_not_in_trip:    'Someone in that expense or payment is no longer in this trip. Reload the page and try again.',
      not_pending:           'That payment has already been dealt with. Reload the page to see the latest.',
      same_member:           'Choose two different people.',
      invalid_name:          'Please use a name of up to 100 characters.',
      invalid_member_name:   'Please use a name of up to 100 characters.',
      invalid_description:   'That description is too long (up to 500 characters).',
      invalid_amount_cents:  "That amount isn't valid or is too large.",
      invalid_split_amount_cents: "One of the split amounts isn't valid.",
      invalid_currency:      "That currency isn't supported.",
      invalid_base_currency: "That currency isn't supported.",
      invalid_expense_currency: "That currency isn't supported.",
      invalid_date:          "That date isn't valid.",
      invalid_split_type:    "That split type isn't valid.",
      body_too_large:        'That is too much to send in one go.',
      invalid_token:         'Sign-in failed. Please try again.',
      provider_not_configured: "That sign-in method isn't switched on.",
      origin_not_allowed:    "This page isn't allowed to talk to the server. Open SplitTrip from its normal address.",
      internal:              'The server had a problem. Please try again in a moment.',
      // Sign-in token problems (the server says why in a code; the person only needs to try again)
      bad_signature: 'Sign-in failed. Please try again.', bad_alg: 'Sign-in failed. Please try again.', bad_audience: 'Sign-in failed. Please try again.',
      bad_issuer: 'Sign-in failed. Please try again.', bad_nonce: 'Sign-in failed. Please try again.', invalid_nonce: 'Sign-in failed. Please try again.',
      unknown_key: 'Sign-in failed. Please try again.', no_subject: 'Sign-in failed. Please try again.',
      not_yet_valid: "Sign-in failed. Check that your device's clock is right, then try again.",
      issued_in_future: "Sign-in failed. Check that your device's clock is right, then try again.",
      jwks_fetch_failed: "Couldn't reach the sign-in provider to check your sign-in. Please try again in a moment.",
      no_email: "That account didn't share an email address, so SplitTrip can't sign you in with it.",
      // Anything else the server can say
      unauthorized: 'Your sign-in has expired. Please sign in again.',
      version_conflict: 'Someone else changed this while you were editing. Close it and reopen to see the latest.',
      invalid_json: "The server couldn't read that. Reload the page and try again.",
      invalid_version: 'Something went out of date. Reload the page and try again.',
      method_not_allowed: "The page and the server are out of step. Reload the page and try again.",
    };
    // Same check the server makes, so a typo is caught before it is sent.
    const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e).trim());
    const readToken  = () => { try { return localStorage.getItem(TOKEN_KEY); } catch (_) { return null; } };
    const writeToken = (t) => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (_) {} };

    async function api(method, path, body, opts = {}) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), opts.ms || 15000);
      const token = readToken();
      let res;
      try {
        res = await fetch(API_BASE + path, {
          method, signal: ctl.signal,
          headers: {
            ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}),
            ...(token && !opts.noAuth ? { Authorization: 'Bearer ' + token } : {}),
          },
          body: body !== undefined ? JSON.stringify(body) : undefined,
        });
      } catch (e) {
        const timedOut = ctl.signal.aborted;
        const err = new ApiError(0, timedOut ? 'timeout' : 'network', timedOut
          ? 'The request timed out. Tap the button to try again.'
          : 'Could not reach the server. Check your connection and try again.');
        logErr('api ' + method + ' ' + path, err);
        throw err;
      } finally { clearTimeout(timer); }
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        const code = (data && data.error) || 'error';
        if (res.status === 401 && !opts.noAuth) { writeToken(null); window.location.reload(); }
        const err = new ApiError(res.status, code, FRIENDLY[code] || ('Something went wrong (' + code + ').'));
        logErr('api ' + method + ' ' + path, err);
        throw err;
      }
      return data;
    }

    // ══════════════════════════════════════════════════
    // 💱  CURRENCIES  (supported by fawazahmed0/currency-api via jsDelivr)
    // ══════════════════════════════════════════════════
    const CURRENCIES = [
      'AED','ALL','AMD','ARS','AUD','AZN','BDT','BGN','BHD','BND',
      'BOB','BRL','CAD','CHF','CLP','CNY','COP','CZK','DKK',
      'DZD','EGP','ETB','EUR','GBP','GEL','GHS','HKD','HUF','IDR',
      'ILS','INR','IQD','ISK','JOD','JPY','KES','KHR','KRW','KWD',
      'KZT','LAK','LBP','LKR','MAD','MDL','MMK','MXN','MYR','NGN',
      'NOK','NPR','NZD','OMR','PEN','PHP','PKR','PLN','QAR','RON',
      'RSD','SAR','SEK','SGD','THB','TRY','TWD','TZS','UAH','UGX',
      'USD','UYU','VND','ZAR',
    ].sort();

    // ══════════════════════════════════════════════════
    // 🔄  EXCHANGE RATE  (cached, historical by date)
    // ══════════════════════════════════════════════════
    // Cache entire base-currency response to minimise API calls
    // e.g. 5 EUR expenses → only 1 fetch for eur@2025-01-10
    // Max 100 entries — evicts oldest when full (normal session: ~10-20 entries)
    const _ratesCache = {};
    let _ratesCacheKeys = [];

    // Cache settlement results by trip ID so switching back to the Settle Up
    // tab shows the previous result immediately instead of flashing a spinner.
    // Keyed as `tripId:currency`. Max 20 entries.
    const _settleCache = {};
    let _settleCacheKeys = [];

    function cacheSet(cache, keys, key, value, max) {
      if (!cache[key]) {
        keys.push(key);
        if (keys.length > max) {
          const evict = keys.shift();
          delete cache[evict];
        }
      }
      cache[key] = value;
    }

    async function getRate(from, to, date) {
      if (from === to) return 1;
      const today = todayISO();
      const apiDate = date >= today ? 'latest' : date;
      const fromL = from.toLowerCase();
      const toL   = to.toLowerCase();
      const cacheKey = `${fromL}@${apiDate}`;

      if (!_ratesCache[cacheKey]) {
        // jsDelivr-hosted currency API — no CORS issues, no API key, free
        const url = `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${apiDate}/v1/currencies/${fromL}.json`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Rate API returned ${res.status}`);
        const data = await res.json();
        cacheSet(_ratesCache, _ratesCacheKeys, cacheKey, data[fromL], 100);
      }

      const rate = _ratesCache[cacheKey]?.[toL];
      if (!rate) throw new Error(`No rate found for ${from}→${to}`);
      return rate;
    }

    // ══════════════════════════════════════════════════
    // 🧮  SETTLEMENT ALGORITHM
    // Returns: { settlements: [{from,to,amount}], balances: {memberId: number} }
    // ══════════════════════════════════════════════════
    async function computeSettlements(expenses, members, baseCurrency, confirmedPayments = []) {
      const balances = {};
      members.forEach(m => { balances[m.id] = 0; });
      let totalSpend = 0;

      // Fetch every distinct rate at the same time first, instead of one network call after another. The loops below then find
      // them in the cache. A failed fetch is ignored here and fails (with the same message as before) when the loop needs it.
      {
        const today = todayISO(), want = new Map();
        const add = (cur, date) => {
          if (cur === baseCurrency) return;
          const apiDate = date >= today ? 'latest' : date;
          want.set(`${cur.toLowerCase()}@${apiDate}`, [cur, date]);
        };
        for (const e of expenses) add(e.currency, e.date);
        for (const p of confirmedPayments) add(p.currency, p.confirmed_at ? localDateOf(p.confirmed_at) : today);
        await Promise.all([...want.values()].map(([c, d]) => getRate(c, baseCurrency, d).catch(() => {})));
      }

      for (const exp of expenses) {
        let rate;
        try {
          rate = await getRate(exp.currency, baseCurrency, exp.date);
        } catch(e) {
          throw new Error(`Could not fetch exchange rate for ${exp.currency}→${baseCurrency}: ${e.message}`);
        }
        totalSpend += exp.amount * rate;
        if (balances[exp.paid_by_member_id] !== undefined) {
          balances[exp.paid_by_member_id] += exp.amount * rate;
        }
        for (const split of (exp.expense_splits || [])) {
          const splitBase = split.amount * rate;
          if (balances[split.member_id] !== undefined) {
            balances[split.member_id] -= splitBase;
          }
        }
      }

      // Apply confirmed payments — reduce balances without affecting total spend
      for (const pmt of confirmedPayments) {
        let rate = 1;
        if (pmt.currency !== baseCurrency) {
          try {
            const date = pmt.confirmed_at ? localDateOf(pmt.confirmed_at) : todayISO();
            rate = await getRate(pmt.currency, baseCurrency, date);
          } catch { /* use rate 1 as fallback */ }
        }
        const converted = pmt.amount * rate;
        if (balances[pmt.from_member_id] !== undefined) balances[pmt.from_member_id] += converted;
        if (balances[pmt.to_member_id]   !== undefined) balances[pmt.to_member_id]   -= converted;
      }

      // Round balances and total
      Object.keys(balances).forEach(k => {
        balances[k] = Math.round(balances[k] * 100) / 100;
      });
      totalSpend = Math.round(totalSpend * 100) / 100;

      // Minimize number of transactions (greedy)
      const pos = [], neg = [];
      Object.entries(balances).forEach(([id, bal]) => {
        if (bal > 0.005)  pos.push({ id, bal });
        if (bal < -0.005) neg.push({ id, bal });
      });
      pos.sort((a, b) => b.bal - a.bal);
      neg.sort((a, b) => a.bal - b.bal);

      const settlements = [];
      let i = 0, j = 0;
      while (i < pos.length && j < neg.length) {
        const amount = Math.min(pos[i].bal, -neg[j].bal);
        if (amount > 0.005) {
          settlements.push({
            from: neg[j].id, to: pos[i].id,
            amount: Math.round(amount * 100) / 100,
          });
        }
        pos[i].bal -= amount;
        neg[j].bal += amount;
        if (pos[i].bal < 0.005) i++;
        if (neg[j].bal > -0.005) j++;
      }

      return { settlements, balances, totalSpend };
    }

    // ══════════════════════════════════════════════════
    // 🗄️  DATABASE HELPERS
    // Same function names and return shapes as before, so no screen changes. Money crosses the wire as integer cents;
    // the screens keep using decimal amounts (cents / 100), exactly what the old numeric(14,2) columns returned.
    // ══════════════════════════════════════════════════
    const _meta = { trips: {}, expenses: {}, payments: {}, members: {} };   // id -> version / trip id, from the last load
    const c2a = (c) => c / 100;
    const a2c = (a) => Math.round(Number(a) * 100);

    const adaptExpense = (e) => {
      _meta.expenses[e.id] = { tripId: e.trip_id, version: e.version };
      const { amount_cents, ...rest } = e;
      return {
        ...rest, amount: c2a(amount_cents),
        expense_splits: (e.expense_splits || []).map(({ amount_cents: sc, ...sr }) => ({ ...sr, expense_id: e.id, amount: c2a(sc) })),
      };
    };
    const adaptPayment = (p) => {
      _meta.payments[p.id] = { tripId: p.trip_id };
      const { amount_cents, ...rest } = p;
      return { ...rest, amount: c2a(amount_cents) };
    };
    const metaOf = (kind, id) => {
      const m = _meta[kind][id];
      if (!m) throw new Error('Please reload the page and try again.');
      return m;
    };
    const expensePayload = (d, splits) => ({
      paid_by_member_id: d.paid_by_member_id, amount_cents: a2c(d.amount), currency: d.currency, date: d.date,
      description: d.description, split_type: d.split_type,
      splits: splits.map(s => ({ member_id: s.memberId, amount_cents: a2c(s.amount) })),
    });

    async function claimMemberships() {
      try { await api('POST', '/me/claim'); } catch (e) { logErr('claimMemberships', e); }
    }

    async function fetchTrips() {
      const data = await api('GET', '/trips');
      // The server keeps a last-activity time per trip, so no expense rows are downloaded just to sort the list.
      return (data || []).map(t => { _meta.trips[t.id] = { version: t.version }; (t.trip_members || []).forEach(m => { _meta.members[m.id] = { tripId: t.id }; }); return t; })
        .sort((a, b) => new Date(b.last_activity_at || b.created_at) - new Date(a.last_activity_at || a.created_at));
    }

    // One request returns the trip's members, expenses and payments (saves two requests each time a trip opens).
    async function fetchTripAll(tripId) {
      const data = await api('GET', '/trips/' + tripId + '/all');
      const members = data.members || [];
      members.forEach(m => { _meta.members[m.id] = { tripId }; });
      return [members, (data.expenses || []).map(adaptExpense), (data.payments || []).map(adaptPayment)];
    }

    async function createTrip(name, description, baseCurrency, expenseCurrency, createdBy, members) {
      const trip = await api('POST', '/trips', {
        name, description, base_currency: baseCurrency, expense_currency: expenseCurrency,
        members: members.map(m => ({ name: m.name, email: m.email ? m.email.trim().toLowerCase() : null, is_self: !!m.isYou })),
      });
      _meta.trips[trip.id] = { version: trip.version };
      return trip;
    }

    async function addMemberToTrip(tripId, name, email) {
      const m = await api('POST', '/trips/' + tripId + '/members', { name, email: email ? email.trim().toLowerCase() : null });
      _meta.members[m.id] = { tripId };
      return m;
    }

    async function saveExpense(tripId, expenseData, splits, userId) {
      const e = await api('POST', '/trips/' + tripId + '/expenses', expensePayload(expenseData, splits));
      return adaptExpense(e);
    }

    async function removeExpense(expenseId) {
      const m = metaOf('expenses', expenseId);
      await api('DELETE', '/trips/' + m.tripId + '/expenses/' + expenseId);
    }

    // The expense and its splits are replaced in one step on the server; a stale edit is refused (see FRIENDLY.stale_version).
    async function updateExpenseRecord(expenseId, expenseData, splits) {
      const m = metaOf('expenses', expenseId);
      const e = await api('PUT', '/trips/' + m.tripId + '/expenses/' + expenseId, { ...expensePayload(expenseData, splits), version: m.version });
      adaptExpense(e);
    }

    async function removeMemberFromTrip(memberId) {
      const m = metaOf('members', memberId);
      await api('DELETE', '/trips/' + m.tripId + '/members/' + memberId);
    }

    async function updateTrip(tripId, data) {
      const m = metaOf('trips', tripId);
      const t = await api('PATCH', '/trips/' + tripId, { ...data, version: m.version });
      _meta.trips[tripId] = { version: t.version };
    }

    async function deleteTripById(tripId) {
      await api('DELETE', '/trips/' + tripId);
    }

    async function updateProfileName(userId, name) {
      await api('PATCH', '/me', { name });
    }

    // ══════════════════════════════════════════════════
    // 💸  PAYMENT HELPERS
    // Payments are permanent records of real money transfers,
    // independent of computed settlements.
    // ══════════════════════════════════════════════════
    async function fetchPayments(tripId) {
      const data = await api('GET', '/trips/' + tripId + '/payments');
      return (data || []).map(adaptPayment);
    }

    async function createPayment({ tripId, fromMemberId, toMemberId, amount, currency, userId }) {
      const p = await api('POST', '/trips/' + tripId + '/payments',
        { from_member_id: fromMemberId, to_member_id: toMemberId, amount_cents: a2c(amount), currency });
      return adaptPayment(p);
    }

    async function confirmPayment(paymentId, userId) {
      const m = metaOf('payments', paymentId);
      await api('POST', '/trips/' + m.tripId + '/payments/' + paymentId + '/confirm');
    }

    async function cancelPayment(paymentId) {
      const m = metaOf('payments', paymentId);
      await api('DELETE', '/trips/' + m.tripId + '/payments/' + paymentId);
    }

    // ══════════════════════════════════════════════════
    // 🎨  FORMATTING HELPERS
    // ══════════════════════════════════════════════════
    const fmt = (amount, currency) => {
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency', currency,
          minimumFractionDigits: 2, maximumFractionDigits: 2,
        }).format(amount);
      } catch { return `${currency} ${amount.toFixed(2)}`; }
    };

    const fmtDate = (d) =>
      new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {
        day: 'numeric', month: 'short', year: 'numeric',
      });

    const fmtDateGroup = (d) =>
      new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long',
      });

    // Dates the person sees are LOCAL dates. toISOString() is UTC, which in Sydney is the day before until about 11 am.
    const localDate = (d = new Date()) => {
      const p = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    };
    const localDateOf = (iso) => localDate(new Date(iso));   // the local date of a stored UTC timestamp
    const todayISO = () => localDate();

    // Amount formatting — used by AddExpenseModal for comma-separated display
    const fmtAmt = (str) => {
      const clean = String(str).replace(/[^0-9.]/g, '');
      const [int, dec] = clean.split('.');
      const intFmt = (int || '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return dec !== undefined ? `${intFmt}.${dec}` : intFmt;
    };
    const parseAmt = (str) => parseFloat(String(str).replace(/,/g, '')) || 0;

    const PALETTE = [
      '#C8964C','#3D8B5E','#4A7FB5','#A0522D','#7B68EE',
      '#C0392B','#2980B9','#16A085','#8E44AD','#D4AC0D',
      '#E67E22','#1ABC9C',
    ];

    function memberColor(idx) { return PALETTE[idx % PALETTE.length]; }

    // Derives a stable palette index from a trip UUID so the card colour
    // never changes as the sort order shifts with new activity.
    function tripColorIdx(id) {
      if (!id) return 0;
      const hex = id.replace(/-/g, '');
      let n = 0;
      for (let i = 0; i < 8; i++) n += parseInt(hex[i], 16);
      return n % PALETTE.length;
    }

    function Avatar({ name = '?', idx = 0, size = 'md', className = '' }) {
      const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      const sz = size === 'sm' ? 'w-7 h-7 text-xs' : size === 'lg' ? 'w-11 h-11 text-sm' : 'w-9 h-9 text-xs';
      return (
        <div
          className={`${sz} rounded-full flex items-center justify-center text-white font-semibold flex-shrink-0 ${className}`}
          style={{ background: memberColor(idx) }}
        >
          {initials}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // 🧩  SHARED UI COMPONENTS
    // ══════════════════════════════════════════════════
    const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } = React;

    function Spinner({ dark }) {
      return <div className={`spinner ${dark ? 'spinner-dark' : ''}`} />;
    }

    function Btn({ children, variant = 'primary', loading, disabled, full, sm, className = '', ...props }) {
      const base = `inline-flex items-center justify-center gap-2 font-semibold tracking-tight transition-all rounded-xl disabled:opacity-50 disabled:cursor-not-allowed`;
      const size = sm ? 'px-3 py-1.5 text-xs' : 'px-4 py-2.5 text-sm';
      const vars = {
        primary:   'bg-ink text-cream hover:bg-ink/85 active:scale-[0.98]',
        gold:      'bg-gold text-white hover:bg-gold-dark active:scale-[0.98] shadow-sm',
        ghost:     'bg-parchment text-ink hover:bg-ink/10 active:scale-[0.98]',
        danger:    'bg-rose-light text-rose hover:bg-rose/20 active:scale-[0.98]',
        outline:   'border border-ink/20 text-ink hover:bg-ink/5 active:scale-[0.98]',
      };
      return (
        <button
          className={`${base} ${size} ${vars[variant]} ${full ? 'w-full' : ''} ${className}`}
          disabled={loading || disabled}
          {...props}
        >
          {loading ? <Spinner /> : children}
        </button>
      );
    }

    function Field({ label, hint, children }) {
      return (
        <div>
          {label && <label className="block text-xs font-semibold text-muted uppercase tracking-widest mb-1.5">{label}</label>}
          {children}
          {hint && <p className="text-xs text-muted mt-1">{hint}</p>}
        </div>
      );
    }

    const inputCls = 'w-full px-3 py-2.5 bg-white border border-ink/12 rounded-xl text-sm text-ink placeholder-muted/50 focus:outline-none focus:ring-2 focus:ring-gold/40 focus:border-gold/50 transition';

    function TextInput({ label, hint, ...props }) {
      return (
        <Field label={label} hint={hint}>
          <input className={inputCls} {...props} />
        </Field>
      );
    }

    // Auto-resizing textarea — grows with content, never shows a scrollbar.
    // Uses useLayoutEffect so the height update happens before paint (no flicker).
    function TextArea({ label, hint, minRows = 2, ...props }) {
      const ref = useRef(null);
      useLayoutEffect(() => {
        const el = ref.current;
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      }, [props.value]);
      return (
        <Field label={label} hint={hint}>
          <textarea
            ref={ref}
            rows={minRows}
            className={inputCls + ' resize-none overflow-hidden leading-relaxed'}
            {...props}
          />
        </Field>
      );
    }

    function SelectInput({ label, hint, children, ...props }) {
      return (
        <Field label={label} hint={hint}>
          <select className={inputCls + ' cursor-pointer'} {...props}>
            {children}
          </select>
        </Field>
      );
    }

    function Modal({ title, onClose, children, wide }) {
      // Prevent body scroll
      useEffect(() => {
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = ''; };
      }, []);

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-bg"
          onClick={e => e.target === e.currentTarget && onClose()}
        >
          <div className={`bg-cream rounded-t-3xl sm:rounded-3xl w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-md'} max-h-[92vh] overflow-y-auto slide-up`}>
            <div className="sticky top-0 bg-cream z-10 flex items-center justify-between px-5 pt-5 pb-4 border-b border-ink/8">
              <h2 className="text-base font-bold text-ink">{title}</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-ink/8 transition text-muted">
                <i className="fa-solid fa-xmark text-sm" />
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Toast({ message, type = 'error', autoDismiss, onDismiss }) {
      useEffect(() => {
        if (autoDismiss && onDismiss) {
          const t = setTimeout(onDismiss, autoDismiss);
          return () => clearTimeout(t);
        }
      }, [autoDismiss, onDismiss]);
      const bg = type === 'error' ? 'bg-rose-light text-rose border-rose/20' : 'bg-moss-light text-moss border-moss/20';
      return (
        <div className={`flex items-center gap-2 px-3 py-2.5 rounded-xl border text-sm ${bg}`}>
          <i className={`fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} flex-shrink-0`} />
          {message}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // 🏠  APP ROOT
    // ══════════════════════════════════════════════════
    function App() {
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [booting, setBooting] = useState(true);
      const [selectedTrip, setSelectedTrip] = useState(null);
      // Guards against onSignIn running twice.
      const hasSignedIn = useRef(false);

      const onSignIn = useCallback(async (u, alreadyClaimed = false) => {
        if (hasSignedIn.current) return;
        hasSignedIn.current = true;
        setUser(u);
        setProfile({ id: u.id, name: u.name, email: u.email });
        if (!alreadyClaimed) await claimMemberships();
      }, []);

      useEffect(() => {
        if (!readToken()) { setBooting(false); return; }
        // One request on open: it attaches any trips this email was invited to AND returns the signed-in user (it used to be two requests).
        // If it fails for a reason other than an expired session (a 401 clears the token and reloads), fall back to the plain profile call.
        api('POST', '/me/claim')
          .then(async (r) => { await onSignIn({ id: r.id, email: r.email, name: r.name }, true); setBooting(false); })
          .catch(() => api('GET', '/me')
            .then(async (me) => { await onSignIn(me); setBooting(false); })
            .catch(() => setBooting(false)));
      }, [onSignIn]);

      if (booting) return (
        <div className="min-h-screen flex flex-col items-center justify-center">
          <div className="flex flex-col items-center gap-4">
            <div className="w-10 h-10 rounded-2xl bg-ink flex items-center justify-center">
              <i className="fa-solid fa-receipt text-cream" />
            </div>
            <Spinner dark />
          </div>
        </div>
      );

      if (!user) return <AuthView onAuth={onSignIn} />;
      if (selectedTrip) return (
        <TripView
          trip={selectedTrip}
          user={user}
          profile={profile}
          onBack={() => setSelectedTrip(null)}
        />
      );
      return <TripsView user={user} profile={profile} onSelectTrip={setSelectedTrip} />;
    }

    // ══════════════════════════════════════════════════
    // 🪟  MICROSOFT SIGN-IN  (authorization code + PKCE, no secret; personal Microsoft accounts only)
    // ══════════════════════════════════════════════════
    const MS_AUTH  = 'https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize';
    const MS_TOKEN = 'https://login.microsoftonline.com/consumers/oauth2/v2.0/token';
    const MS_KEY   = 'splittrip.ms.pending.v1';
    const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const randomString = (n) => b64url(crypto.getRandomValues(new Uint8Array(n)));
    const msRedirectUri = () => window.location.origin + window.location.pathname;

    async function startMicrosoftSignIn() {
      const verifier = randomString(48), state = randomString(16), nonce = randomString(16);
      const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
      sessionStorage.setItem(MS_KEY, JSON.stringify({ verifier, state, nonce }));
      const q = new URLSearchParams({
        client_id: MS_CLIENT_ID, response_type: 'code', redirect_uri: msRedirectUri(), response_mode: 'query',
        scope: 'openid profile email', state, nonce, code_challenge: challenge, code_challenge_method: 'S256', prompt: 'select_account',
      });
      window.location.assign(MS_AUTH + '?' + q.toString());
    }

    // Runs when the sign-in screen opens. Returns the signed-in user, or null if this page load is not a return from Microsoft.
    async function finishMicrosoftSignIn() {
      const q = new URLSearchParams(window.location.search);
      if (!q.get('code') && !q.get('error')) return null;
      const pending = JSON.parse(sessionStorage.getItem(MS_KEY) || 'null');
      sessionStorage.removeItem(MS_KEY);
      window.history.replaceState(null, '', window.location.pathname);
      if (q.get('error')) throw new Error('Microsoft sign-in was cancelled or failed.');
      if (!pending || pending.state !== q.get('state')) throw new Error('Microsoft sign-in could not be verified. Please try again.');
      const res = await fetch(MS_TOKEN, {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ client_id: MS_CLIENT_ID, grant_type: 'authorization_code', code: q.get('code'),
                                    redirect_uri: msRedirectUri(), code_verifier: pending.verifier }),
      });
      const tok = await res.json().catch(() => ({}));
      if (!res.ok || !tok.id_token) { logErr('microsoft token', { message: tok.error_description || tok.error || ('status ' + res.status) }); throw new Error('Microsoft sign-in failed. Please try again.'); }
      const out = await api('POST', '/auth/microsoft', { idToken: tok.id_token, nonce: pending.nonce }, { noAuth: true });
      writeToken(out.token);
      return out.user;
    }

    // ══════════════════════════════════════════════════
    // 🔐  AUTH VIEW
    // ══════════════════════════════════════════════════
    function AuthView({ onAuth }) {
      const [err, setErr]     = useState('');
      const [loading, setLoad] = useState(false);
      const btnRef = useRef(null);

      useEffect(() => {
        let tries = 0, stopped = false;
        const init = () => {
          if (stopped) return;
          if (!(window.google && window.google.accounts && window.google.accounts.id)) {
            if (tries++ < 50) setTimeout(init, 100);
            else setErr('Could not load Google sign-in. Check your connection and reload the page.');
            return;
          }
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: async (r) => {
              setErr(''); setLoad(true);
              try {
                const out = await api('POST', '/auth/google', { idToken: r.credential }, { noAuth: true });
                writeToken(out.token);
                onAuth(out.user);
              } catch (e) { setErr(e?.message || 'Something went wrong.'); setLoad(false); }
            },
          });
          google.accounts.id.renderButton(btnRef.current, { theme: 'outline', size: 'large', width: 280, text: 'signin_with' });
        };
        init();
        return () => { stopped = true; };
      }, []);

      // Coming back from Microsoft's sign-in page: finish the sign-in.
      useEffect(() => {
        if (!MS_CLIENT_ID) return;
        let alive = true;
        (async () => {
          try {
            setLoad(true);
            const u = await finishMicrosoftSignIn();
            if (!alive) return;
            if (u) onAuth(u); else setLoad(false);
          } catch (e) { if (alive) { setErr(e?.message || 'Something went wrong.'); setLoad(false); } }
        })();
        return () => { alive = false; };
      }, []);

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-cream">
          <div className="w-full max-w-sm fade-up">
            {/* Brand */}
            <div className="text-center mb-8">
              <div className="w-14 h-14 bg-ink rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i className="fa-solid fa-receipt text-gold text-xl" />
              </div>
              <h1 className="text-2xl font-bold text-ink tracking-tight">SplitTrip</h1>
              <p className="text-sm text-muted mt-1">Shared expenses, simplified.</p>
            </div>

            <div className="bg-white rounded-2xl border border-ink/8 p-6 shadow-sm">
              <p className="text-sm text-muted text-center mb-4">Sign in to continue</p>
              <div className="flex justify-center min-h-[44px]"><div ref={btnRef} /></div>
              {MS_CLIENT_ID && (
                <button onClick={() => startMicrosoftSignIn().catch(e => setErr(e?.message || 'Something went wrong.'))}
                  className="mt-3 mx-auto flex items-center justify-center gap-2 w-[280px] h-10 rounded border border-ink/20 bg-white text-sm font-semibold text-ink hover:bg-parchment transition">
                  <svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
                  Sign in with Microsoft
                </button>
              )}
              {loading && <div className="flex justify-center mt-4"><Spinner dark /></div>}
              {err && <div className="mt-3"><Toast message={err} /></div>}
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // 👤  ACCOUNT MODAL
    // ══════════════════════════════════════════════════
    function AccountModal({ user, onClose }) {
      const [section, setSection] = useState('menu'); // menu | delete
      const [deleteConfirm, setDeleteConfirm] = useState('');
      const [deletingAcct, setDeletingAcct]   = useState(false);
      const [deleteErr, setDeleteErr] = useState('');

      const deleteAccount = async () => {
        if (deleteConfirm !== 'DELETE') { setDeleteErr('Type DELETE in capitals to confirm.'); return; }
        setDeletingAcct(true);
        // Only sign out once the server has confirmed the deletion. If the request fails (offline, server problem) the account
        // still exists, so say so and let the person try again.
        setDeleteErr('');
        try { await api('DELETE', '/me'); }
        catch (e) {
          // 401 = the session is already gone (for example the account was deleted but the reply was lost). Nothing is left to delete: sign out.
          if (e && e.status === 401) { writeToken(null); window.location.reload(); return; }
          setDeletingAcct(false);
          setDeleteErr((e && e.message) || 'Could not delete the account. Please try again.');
          return;
        }
        writeToken(null);
        window.location.reload();
      };

      return (
        <Modal title="Account" onClose={onClose}>
          {section === 'menu' && (
            <div className="space-y-2">
              <p className="text-xs text-muted mb-4">{user.email}</p>
              <button onClick={() => setSection('delete')}
                className="w-full flex items-center gap-3 p-3 bg-parchment rounded-xl hover:bg-rose/10 transition text-left">
                <div className="w-8 h-8 bg-white rounded-lg flex items-center justify-center flex-shrink-0">
                  <i className="fa-solid fa-user-minus text-rose text-xs" />
                </div>
                <div>
                  <p className="text-sm font-semibold text-rose">Delete account</p>
                  <p className="text-xs text-muted">Permanently remove your account</p>
                </div>
                <i className="fa-solid fa-chevron-right text-muted text-xs ml-auto" />
              </button>
            </div>
          )}

          {section === 'delete' && (
            <div className="space-y-4">
              <button onClick={() => setSection('menu')} className="flex items-center gap-1.5 text-xs text-muted hover:text-ink transition mb-1">
                <i className="fa-solid fa-arrow-left" /> Back
              </button>
              <div className="bg-rose-light border border-rose/20 rounded-xl p-4">
                <p className="text-sm font-semibold text-ink mb-1">This cannot be undone</p>
                <p className="text-xs text-muted leading-relaxed">
                  Your account will be permanently deleted and you'll be logged out. Your name and email address will stay on the people list of any shared trips, so everyone's expenses still add up. To use SplitTrip again you would need to be invited again.
                </p>
              </div>
              <Field label='Type DELETE to confirm'>
                <input value={deleteConfirm} onChange={e => setDeleteConfirm(e.target.value)}
                  placeholder="DELETE"
                  className={inputCls} />
              </Field>
              {deleteErr && <Toast message={deleteErr} />}
              <Btn variant="danger" full loading={deletingAcct} disabled={deleteConfirm !== 'DELETE'} onClick={deleteAccount}>
                Permanently Delete My Account
              </Btn>
            </div>
          )}
        </Modal>
      );
    }

    // ══════════════════════════════════════════════════
    // 🗺️  TRIPS LIST
    // ══════════════════════════════════════════════════
    function TripsView({ user, profile: initialProfile, onSelectTrip }) {
      const [trips, setTrips]         = useState([]);
      const [loading, setLoading]     = useState(true);
      const [loadError, setLoadError] = useState('');
      const [showCreate, setCreate]   = useState(false);
      const [profile, setProfile]     = useState(initialProfile);
      const [editingName, setEditingName] = useState(false);
      const [editName, setEditName]   = useState('');
      const [savingName, setSavingName] = useState(false);

      const [nameErr, setNameErr] = useState('');
      const [showAccount, setShowAccount] = useState(false);
      const startEditName = () => { setEditName(profile?.name || ''); setEditingName(true); setNameErr(''); };
      const cancelEditName = () => { setEditingName(false); setNameErr(''); };
      const saveNameChange = async () => {
        if (!editName.trim()) return;
        setSavingName(true);
        setNameErr('');
        try {
          await updateProfileName(user.id, editName.trim());
          setProfile(p => ({ ...p, name: editName.trim() }));
          setEditingName(false);
        } catch(e) { setNameErr(e?.message || 'Could not save name.'); }
        setSavingName(false);
      };

      const load = useCallback(async () => {
        setLoading(true);
        setLoadError('');
        try {
          setTrips(await fetchTrips());
        } catch (e) {
          console.error('Failed to load trips:', e);
          setLoadError(e?.message || 'Could not load your trips. Check your connection and try again.');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      return (
        <div className="min-h-screen bg-cream">
          {/* Header */}
          <div className="bg-ink text-cream sticky top-0 z-20">
            <div className="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
              <button onClick={() => window.location.reload()} className="flex items-center gap-2.5 hover:opacity-80 transition active:scale-95">
                <div className="w-8 h-8 bg-gold rounded-lg flex items-center justify-center">
                  <i className="fa-solid fa-receipt text-white text-sm" />
                </div>
                <span className="font-bold tracking-tight">SplitTrip</span>
              </button>
              <div className="flex items-center gap-2">
                {editingName ? (
                  <div className="flex flex-col gap-1">
                    <div className="flex items-center gap-1.5">
                      <input
                        autoFocus
                        value={editName}
                        onChange={e => setEditName(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') saveNameChange(); if (e.key === 'Escape') cancelEditName(); }}
                        className="w-28 px-2 py-1 bg-cream/10 border border-cream/20 rounded-lg text-xs text-cream focus:outline-none focus:border-gold/60"
                      />
                      <button onClick={cancelEditName} className="text-cream/40 hover:text-cream transition text-xs">
                        <i className="fa-solid fa-xmark" />
                      </button>
                      <button onClick={saveNameChange} disabled={savingName}
                        className="text-gold hover:text-gold-light transition text-xs disabled:opacity-50">
                        {savingName ? <Spinner /> : <i className="fa-solid fa-check" />}
                      </button>
                    </div>
                    {nameErr && <Toast message={nameErr} />}
                  </div>
                ) : (
                  <button onClick={startEditName}
                    className="flex items-center gap-1.5 text-xs text-cream/50 hover:text-cream transition group max-w-[120px]">
                    <span className="truncate">{profile?.name || user.email}</span>
                    <i className="fa-solid fa-pen text-cream/20 group-hover:text-cream/60 transition text-xs flex-shrink-0" />
                  </button>
                )}
                <button onClick={() => setShowAccount(true)}
                  className="w-9 h-9 flex items-center justify-center rounded-xl text-cream/50 hover:text-cream hover:bg-cream/10 transition" title="Account settings">
                  <i className="fa-solid fa-gear text-sm" />
                </button>
                <button onClick={() => {
                    const t = readToken();             // revoke on the server, then clear our own key only
                    if (t) fetch(API_BASE + '/me/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t }, keepalive: true }).catch(() => {});
                    writeToken(null);
                    window.location.reload();
                  }}
                  className="w-9 h-9 flex items-center justify-center rounded-xl text-cream/50 hover:text-cream hover:bg-cream/10 transition" title="Sign out">
                  <i className="fa-solid fa-arrow-right-from-bracket text-sm" />
                </button>
              </div>
            </div>
          </div>
          {showAccount && (
            <AccountModal user={user} onClose={() => setShowAccount(false)} />
          )}

          <div className="max-w-lg mx-auto px-4 py-6">
            <div className="flex items-start justify-between mb-5">
              <div>
                <h2 className="text-xl font-bold text-ink">Your Trips</h2>
                <p className="text-sm text-muted">Select one or create a new trip</p>
              </div>
              <Btn variant="gold" onClick={() => setCreate(true)} sm>
                <i className="fa-solid fa-plus" /> New Trip
              </Btn>
            </div>

            {loading ? (
              <div className="flex justify-center py-16"><Spinner dark /></div>
            ) : loadError ? (
              <div className="text-center py-14 bg-white rounded-2xl border border-rose/20 fade-up">
                <i className="fa-solid fa-triangle-exclamation text-2xl text-rose mb-3" />
                <p className="font-semibold text-ink">Connection error</p>
                <p className="text-sm text-muted mt-1 mb-4 px-4">{loadError}</p>
                <Btn variant="ghost" onClick={load}>Try again</Btn>
              </div>
            ) : trips.length === 0 ? (
              <div className="text-center py-16 bg-white rounded-2xl border border-ink/8 fade-up">
                <div className="w-14 h-14 bg-parchment rounded-2xl flex items-center justify-center mx-auto mb-3">
                  <i className="fa-solid fa-plane text-gold text-xl" />
                </div>
                <p className="font-semibold text-ink">No trips yet</p>
                <p className="text-sm text-muted mt-1 mb-4">Create your first shared trip</p>
                <Btn variant="gold" onClick={() => setCreate(true)}>
                  <i className="fa-solid fa-plus" /> Create a Trip
                </Btn>
              </div>
            ) : (
              <div className="space-y-3">
                {trips.map((trip, i) => (
                  <TripCard key={trip.id} trip={trip} onClick={() => onSelectTrip(trip)} />
                ))}
              </div>
            )}
          </div>

          {showCreate && (
            <CreateTripModal
              user={user} profile={profile}
              onCreated={trip => { setCreate(false); load(); onSelectTrip(trip); }}
              onClose={() => setCreate(false)}
            />
          )}
        </div>
      );
    }

    function TripCard({ trip, onClick }) {

      const colorIdx = tripColorIdx(trip.id);

        <button onClick={onClick}
          className="w-full bg-white rounded-2xl border border-ink/8 p-4 text-left hover:border-gold/40 hover:shadow-md transition-all active:scale-[0.99] fade-up">
          <div className="flex items-start gap-3">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
              style={{ background: memberColor(colorIdx), opacity: 0.85 }}>
              <i className="fa-solid fa-plane text-white text-sm" />
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <h3 className="font-semibold text-ink truncate">{trip.name}</h3>
              </div>
              <div className="flex items-center gap-2 mt-2">
                <div className="flex -space-x-2">
                  {members.slice(0, 5).map((m, i) => (
                    <Avatar key={m.id} name={m.name} idx={i} size="sm" className="border-2 border-white" />
