    function MemberListWithEdit({ members, user, isCreator, onRefresh }) {
      const [editingId, setEditingId]   = useState(null);
      const [editName, setEditName]     = useState('');
      const [saving, setSaving]         = useState(false);
      const [editErr, setEditErr]       = useState('');
      const [confirmRemove, setConfirm] = useState(null);
      const [removing, setRemoving]     = useState(null);
      const [removeErr, setRemoveErr]   = useState('');

      const startEdit = (m) => { setEditingId(m.id); setEditName(m.name); setEditErr(''); };
      const cancelEdit = () => { setEditingId(null); setEditErr(''); };

      const saveEdit = async (m) => {
        // m is passed for context but name edits are always for the current user —
        // the edit button is only rendered for m.user_id === user.id.
        if (!editName.trim()) { setEditErr('Name cannot be empty.'); return; }
        setSaving(true);
        try {
          await updateProfileName(user.id, editName.trim());
          await onRefresh();
          setEditingId(null);
        } catch(e) { setEditErr(e?.message || 'Could not save name.'); }
        setSaving(false);
      };

      const handleRemove = async (m) => {
        setRemoving(m.id); setConfirm(null); setRemoveErr('');
        try {
          await removeMemberFromTrip(m.id);
          await onRefresh();
        } catch(e) {
          const msg = e?.message || '';
          if (msg.includes('foreign key') || msg.includes('violates')) {
            setRemoveErr(`${m.name} can't be removed because they have expenses recorded against them. Delete their expenses first.`);
          } else {
            setRemoveErr(msg || 'Could not remove member.');
          }
        }
        setRemoving(null);
      };

      return (
        <>
          {members.map((m, i) => (
            <div key={m.id} className="border-t border-parchment first:border-0">
              {editingId === m.id ? (
                <div className="px-4 py-3 space-y-2">
                  <input autoFocus value={editName} onChange={e => setEditName(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') saveEdit(m); if (e.key === 'Escape') cancelEdit(); }}
                    className="w-full px-3 py-2 bg-white border border-gold/40 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-gold/40" />
                  {editErr && <p className="text-xs text-rose">{editErr}</p>}
                  <div className="flex gap-2">
                    <Btn variant="outline" sm full onClick={cancelEdit}>Cancel</Btn>
                    <Btn variant="gold" sm full loading={saving} onClick={() => saveEdit(m)}>Save</Btn>
                  </div>
                </div>
              ) : (
                <div className="flex items-center gap-3 px-4 py-3">
                  <Avatar name={m.name} idx={i} />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-ink truncate">{m.name}</p>
                    {m.email && <p className="text-xs text-muted truncate">{m.email}</p>}
                  </div>
                  {m.user_id
                    ? <span className="text-xs font-semibold text-moss bg-moss-light px-2 py-0.5 rounded-full">Active</span>
                    : <span className="text-xs text-muted bg-parchment px-2 py-0.5 rounded-full">{m.email ? 'Invited' : 'Offline'}</span>
                  }
                  {m.user_id === user.id && (
                    <button onClick={() => startEdit(m)}
                      className="text-muted hover:text-ink transition ml-1" title="Edit your name">
                      <i className="fa-solid fa-pen text-xs" />
                    </button>
                  )}
                  {isCreator && !m.user_id && m.user_id !== user.id && (
                    confirmRemove === m.id ? (
                      <div className="flex items-center gap-1.5 ml-1">
                        <button onClick={() => setConfirm(null)} className="text-xs text-muted hover:text-ink transition">Cancel</button>
                        <button onClick={() => handleRemove(m)} disabled={removing === m.id}
                          className="text-xs font-semibold text-rose hover:text-rose/70 transition disabled:opacity-50">
                          {removing === m.id ? <Spinner /> : 'Remove'}
                        </button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirm(m.id)}
                        className="text-muted/50 hover:text-rose transition ml-1" title="Remove from trip">
                        <i className="fa-solid fa-user-minus text-xs" />
                      </button>
                    )
                  )}
                </div>
              )}
            </div>
          ))}
          {removeErr && <div className="mt-2"><Toast message={removeErr} /></div>}
        </>
      );
    }

    function CopyUrlButton() {
      const [copied, setCopied] = useState(false);
      const copy = () => {
        navigator.clipboard.writeText(window.location.href)
          .then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); })
          .catch(() => {
            // Fallback for browsers without clipboard API
            const ta = document.createElement('textarea');
            ta.value = window.location.href;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
      };
      return (
        <button onClick={copy}
          className={`mt-2 flex items-center gap-1.5 text-xs font-semibold transition ${copied ? 'text-moss' : 'text-gold hover:text-gold-dark'}`}>
          <i className={`fa-solid ${copied ? 'fa-circle-check' : 'fa-link'} text-xs`} />
          {copied ? 'Link copied!' : 'Copy app link'}
        </button>
      );
    }

    function PeopleTab({ trip, members, user, isCreator, onRefresh }) {
      const [showForm, setForm]   = useState(false);
      const [name, setName]       = useState('');
      const [email, setEmail]     = useState('');
      const [err, setErr]         = useState('');
      const [loading, setLoad]    = useState(false);

      const handleAdd = async () => {
        if (!name.trim()) { setErr('Name required.'); return; }
        if (email.trim() && !validEmail(email)) { setErr("That email address doesn't look right. Check it, or leave it empty."); return; }
        setErr(''); setLoad(true);
        try {
          await addMemberToTrip(trip.id, name.trim(), email.trim() || null);
          setName(''); setEmail(''); setForm(false);
          await onRefresh();
        } catch (e) { setErr(e?.message || 'Failed to add.'); }
        setLoad(false);
      };

      return (
        <div className="space-y-4 pb-8">
          <div className="bg-white rounded-2xl border border-ink/8 overflow-hidden">
            <div className="flex items-center justify-between px-4 pt-4 pb-3">
              <p className="font-semibold text-ink">{members.length} {members.length === 1 ? 'Person' : 'People'}</p>
              <button onClick={() => setForm(!showForm)}
                className="text-xs font-semibold text-gold hover:text-gold-dark transition flex items-center gap-1">
                <i className="fa-solid fa-plus" /> Add person
              </button>
            </div>

            {showForm && (
              <div className="mx-4 mb-3 bg-parchment rounded-xl p-3 space-y-2">
                <input value={name} onChange={e => setName(e.target.value)} placeholder="Name *"
                  className="w-full px-3 py-2 bg-white border border-ink/12 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold/40" />
                <input value={email} onChange={e => setEmail(e.target.value)} placeholder="Email (optional)"
                  className="w-full px-3 py-2 bg-white border border-ink/12 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold/40" />
                {err && <p className="text-xs text-rose">{err}</p>}
                <div className="flex gap-2">
                  <Btn variant="outline" sm full onClick={() => { setForm(false); setErr(''); }}>Cancel</Btn>
                  <Btn variant="gold" sm full loading={loading} onClick={handleAdd}>Add</Btn>
                </div>
              </div>
            )}

            <MemberListWithEdit members={members} user={user} isCreator={isCreator} onRefresh={onRefresh} />
          </div>

          {/* Invite instructions */}
          <div className="bg-gold-light border border-gold/20 rounded-2xl p-4">
            <div className="flex gap-3">
              <i className="fa-solid fa-envelope text-gold mt-0.5 flex-shrink-0" />
              <div className="flex-1 min-w-0">
                <p className="text-sm font-semibold text-ink">How to invite someone</p>
                <p className="text-xs text-muted mt-1 leading-relaxed">
                  Add their email above, then share this app's URL. When they sign up with that email, this trip will appear in their account automatically — no invite code needed.
                </p>
                <CopyUrlButton />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // ✏️  EDIT TRIP MODAL
    // ══════════════════════════════════════════════════
    function EditTripModal({ trip, onSaved, onClose }) {
      const [name, setName]     = useState(trip.name);
      const [desc, setDesc]     = useState(trip.description || '');
      const [curr, setCurr]     = useState(trip.base_currency);
      const [expCurr, setExpCurr] = useState(trip.expense_currency || trip.base_currency);
      const [err, setErr]       = useState('');
      const [loading, setLoad]  = useState(false);

      const submit = async () => {
        if (!name.trim()) { setErr('Trip name is required.'); return; }
        setErr(''); setLoad(true);
        try {
          await updateTrip(trip.id, { name: name.trim(), description: desc.trim(), base_currency: curr, expense_currency: expCurr });
          onSaved({ ...trip, name: name.trim(), description: desc.trim(), base_currency: curr, expense_currency: expCurr });
        } catch(e) { setErr(e?.message || 'Could not save trip.'); setLoad(false); }
      };

      return (
        <Modal title="Edit Trip" onClose={onClose}>
          <div className="space-y-4">
            <TextInput label="Trip name *" value={name} onChange={e => setName(e.target.value)} />
            <TextArea label="Description" value={desc} onChange={e => setDesc(e.target.value)} minRows={2} />
            <div className="grid grid-cols-2 gap-3">
              <SelectInput label="Default expense currency" value={expCurr} onChange={e => setExpCurr(e.target.value)}>
                {CURRENCIES.map(c => <option key={c}>{c}</option>)}
              </SelectInput>
              <SelectInput label="Default settlement currency" value={curr} onChange={e => setCurr(e.target.value)}>
                {CURRENCIES.map(c => <option key={c}>{c}</option>)}
              </SelectInput>
            </div>
            {err && <Toast message={err} />}
            <div className="flex gap-2 pt-1">
              <Btn variant="outline" full onClick={onClose}>Cancel</Btn>
              <Btn variant="gold" full loading={loading} onClick={submit}>Save Changes</Btn>
            </div>
          </div>
        </Modal>
      );
    }

    // ══════════════════════════════════════════════════
    // 🚀  RENDER
    // ══════════════════════════════════════════════════
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
